<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="100%" height="auto" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="820" height="430" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="410" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Ключові правила укомплектування конфігурації ІС</text>

  <!-- Row 1 -->
  <rect x="30" y="58" width="230" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="145" y="86" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">1. Профілювання задач</text>
  <line x1="260" y1="81" x2="296" y2="81" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="302" y="58" width="488" height="46" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="320" y="86" font-size="12.5" fill="#1e293b">Визначення лімітуючого ресурсу (CPU, RAM, Диск, Мережа)</text>

  <!-- Row 2 -->
  <rect x="30" y="116" width="230" height="46" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="145" y="144" text-anchor="middle" font-size="13.5" font-weight="700" fill="#991b1b">2. Відсутність дисбалансу</text>
  <line x1="260" y1="139" x2="296" y2="139" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="302" y="116" width="488" height="46" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="320" y="144" font-size="12.5" fill="#1e293b">Виявлення та усунення вузьких місць (Bottlenecks)</text>

  <!-- Row 3 -->
  <rect x="30" y="174" width="230" height="46" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="145" y="202" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14532d">3. Апаратна сумісність</text>
  <line x1="260" y1="197" x2="296" y2="197" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="302" y="174" width="488" height="46" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="320" y="202" font-size="12.5" fill="#1e293b">Сокет, чіпсет, форм-фактор, лінії PCIe, стандарти RAM</text>

  <!-- Row 4 -->
  <rect x="30" y="232" width="230" height="46" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="145" y="260" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">4. Енергетичний баланс</text>
  <line x1="260" y1="255" x2="296" y2="255" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="302" y="232" width="488" height="46" rx="8" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="320" y="260" font-size="12.5" fill="#1e293b">Запас потужності БЖ 20–30%, ККД 80 PLUS, захисти</text>

  <!-- Row 5 -->
  <rect x="30" y="290" width="230" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="145" y="318" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">5. Програмна готовність</text>
  <line x1="260" y1="313" x2="296" y2="313" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="302" y="290" width="488" height="46" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="320" y="318" font-size="12.5" fill="#1e293b">64-бітні драйвери під ОС, підтримка віртуалізації</text>

  <!-- Row 6 -->
  <rect x="30" y="348" width="230" height="46" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="145" y="376" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14532d">6. Економіка (TCO)</text>
  <line x1="260" y1="371" x2="296" y2="371" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="302" y="348" width="488" height="46" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="320" y="376" font-size="12.5" fill="#1e293b">Оптимальне співвідношення закупівлі (CapEx) і сервісу (OpEx)</text>
</svg>
