<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" width="100%" height="auto" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="800" height="370" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Гібридна схема: Nginx (Frontend) + Apache / PHP-FPM (Backend)</text>

  <!-- Client Box -->
  <rect x="52" y="52" width="284" height="54" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="194" y="76" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e3a8a">Клієнт (Веббраузер або curl)</text>
  <text x="194" y="95" text-anchor="middle" font-size="12" fill="#172554">Надсилає HTTP/HTTPS-запити до сайту</text>

  <!-- Arrow Client -> Nginx -->
  <line x1="194" y1="106" x2="194" y2="140" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow-dark)"/>
  <text x="206" y="128" font-size="12" font-weight="600" fill="#334155">HTTP :80 / HTTPS :443</text>

  <!-- Nginx Frontend Box -->
  <rect x="52" y="144" width="284" height="86" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <rect x="52" y="144" width="284" height="34" rx="10" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.8"/>
  <text x="194" y="166" text-anchor="middle" font-size="14.5" font-weight="700" fill="#14532d">Nginx (Frontend / Reverse Proxy)</text>
  <text x="194" y="196" text-anchor="middle" font-size="12" fill="#052e16">Асинхронна обробка тисяч з'єднань</text>
  <text x="194" y="216" text-anchor="middle" font-size="11.5" fill="#166534">SSL/TLS-термінація • Кешування • Захист DoS</text>

  <!-- Arrow Nginx -> Static Disk -->
  <line x1="336" y1="187" x2="472" y2="187" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrow-amber)"/>
  <text x="404" y="177" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b45309">Статика</text>
  <text x="404" y="204" text-anchor="middle" font-size="11" fill="#92400e">HTML, CSS, IMG</text>

  <!-- Static Disk Box -->
  <rect x="478" y="144" width="276" height="86" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <rect x="478" y="144" width="276" height="34" rx="10" fill="#fde68a" stroke="#d97706" stroke-width="1.8"/>
  <text x="616" y="166" text-anchor="middle" font-size="14.5" font-weight="700" fill="#78350f">Диск сервера (/var/www/site)</text>
  <text x="616" y="196" text-anchor="middle" font-size="12" fill="#451a03">Файли HTML, CSS, JS, зображення</text>
  <text x="616" y="216" text-anchor="middle" font-size="11.5" fill="#92400e">Миттєва пряма віддача без Backend</text>

  <!-- Arrow Nginx -> Backend -->
  <line x1="194" y1="230" x2="194" y2="268" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrow-red)"/>
  <text x="206" y="248" font-size="11.5" font-weight="700" fill="#b91c1c">Динамічний запит (PHP, Python)</text>
  <text x="206" y="264" font-size="11" fill="#7f1d1d">proxy_pass :8080 або fastcgi_pass</text>

  <!-- Backend Box -->
  <rect x="52" y="274" width="284" height="72" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <rect x="52" y="274" width="284" height="32" rx="10" fill="#fecaca" stroke="#dc2626" stroke-width="1.8"/>
  <text x="194" y="295" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">Apache HTTP Server / PHP-FPM (Backend)</text>
  <text x="194" y="325" text-anchor="middle" font-size="12" fill="#450a0a">Виконання серверних скриптів</text>
  <text x="194" y="340" text-anchor="middle" font-size="11" fill="#991b1b">Генерація динамічних HTML / JSON відповідей</text>

  <!-- Arrow Backend -> Database -->
  <line x1="336" y1="310" x2="472" y2="310" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow-dark)"/>
  <text x="404" y="301" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">SQL-запити</text>
  <text x="404" y="327" text-anchor="middle" font-size="11" fill="#475569">та результати</text>

  <!-- Database Box -->
  <rect x="478" y="274" width="276" height="72" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="1.8"/>
  <rect x="478" y="274" width="276" height="32" rx="10" fill="#cbd5e1" stroke="#475569" stroke-width="1.8"/>
  <text x="616" y="295" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">База даних (PostgreSQL / MySQL)</text>
  <text x="616" y="325" text-anchor="middle" font-size="12" fill="#1e293b">Зберігання та обробка структурованих даних</text>
  <text x="616" y="340" text-anchor="middle" font-size="11" fill="#475569">Обмін даними на внутрішньому інтерфейсі</text>
</svg>
