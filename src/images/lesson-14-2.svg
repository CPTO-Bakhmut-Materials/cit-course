<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#1e293b"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="820" height="560" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="410" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Діаграма активності з доріжками (Swimlanes): видача КЕП</text>

  <!-- Swimlane 1: User -->
  <rect x="20" y="45" width="250" height="495" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="20" y="45" width="250" height="34" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="145" y="67" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Здобувач освіти</text>

  <!-- Swimlane 2: Diia App -->
  <rect x="270" y="45" width="265" height="495" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <rect x="270" y="45" width="265" height="34" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="402" y="67" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">Застосунок «Дія»</text>

  <!-- Swimlane 3: CA Server -->
  <rect x="535" y="45" width="265" height="495" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <rect x="535" y="45" width="265" height="34" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="667" y="67" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">Сервер КНЕДП</text>

  <!-- Initial Node -->
  <circle cx="145" cy="99" r="9" fill="#0f172a"/>
  <line x1="145" y1="108" x2="145" y2="128" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Action 1 (User): BankID -->
  <rect x="45" y="130" width="200" height="40" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="145" y="155" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">Авторизація через BankID</text>

  <!-- Arrow User -> App -->
  <line x1="245" y1="150" x2="303" y2="150" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Action 2 (App): Request FaceID -->
  <rect x="305" y="128" width="195" height="44" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="402" y="147" text-anchor="middle" font-size="12" font-weight="600" fill="#78350f">Запит на біометричну</text>
  <text x="402" y="163" text-anchor="middle" font-size="12" font-weight="600" fill="#78350f">верифікацію (FaceID)</text>

  <!-- Arrow App -> User -->
  <path d="M 305 164 L 285 164 L 285 212 L 247 212" fill="none" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Action 3 (User): Pass FaceID -->
  <rect x="45" y="192" width="200" height="44" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="145" y="211" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">Пройти перевірку FaceID</text>
  <text x="145" y="227" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">перед камерою</text>

  <!-- Arrow User -> Decision (App) -->
  <line x1="245" y1="224" x2="344" y2="224" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Decision Diamond (App) -->
  <polygon points="402,196 458,224 402,252 346,224" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="402" y="221" text-anchor="middle" font-size="11" font-weight="700" fill="#78350f">Біометрія</text>
  <text x="402" y="234" text-anchor="middle" font-size="11" font-weight="700" fill="#78350f">підтверджена?</text>

  <!-- Decision [Ні] -> Error -> Flow Final -->
  <line x1="402" y1="252" x2="402" y2="282" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <text x="422" y="272" font-size="11.5" font-weight="700" fill="#b91c1c">[Ні]</text>

  <rect x="308" y="284" width="188" height="38" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="402" y="308" text-anchor="middle" font-size="12" font-weight="600" fill="#7f1d1d">Особу не розпізнано</text>

  <line x1="402" y1="322" x2="402" y2="346" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <circle cx="402" cy="360" r="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <line x1="394" y1="352" x2="410" y2="368" stroke="#dc2626" stroke-width="2"/>
  <line x1="410" y1="352" x2="394" y2="368" stroke="#dc2626" stroke-width="2"/>
  <text x="458" y="364" font-size="11" font-weight="600" fill="#b91c1c">Кінець потоку</text>

  <!-- Decision [Так] -> Fork (CA Server) -->
  <line x1="458" y1="224" x2="558" y2="224" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="498" y="216" text-anchor="middle" font-size="11.5" font-weight="700" fill="#15803d">[Так]</text>

  <!-- Fork Bar in Lane 3 -->
  <rect x="560" y="219" width="215" height="9" rx="3" fill="#0f172a"/>
  <text x="667" y="210" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">Fork (розпаралелювання)</text>

  <!-- Parallel Branches -->
  <line x1="605" y1="228" x2="605" y2="256" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="730" y1="228" x2="730" y2="256" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="546" y="258" width="118" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="605" y="278" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d">Генерація ключів</text>
  <text x="605" y="294" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d">RSA / ECDSA</text>

  <rect x="672" y="258" width="118" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="731" y="278" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d">Перевірка</text>
  <text x="731" y="294" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d">чинності в ЄДР</text>

  <!-- Join Bar -->
  <line x1="605" y1="304" x2="605" y2="332" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="730" y1="304" x2="730" y2="332" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="560" y="334" width="215" height="9" rx="3" fill="#0f172a"/>
  <text x="722" y="358" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">Join (синхронізація)</text>

  <!-- Action: Issue Certificate -->
  <line x1="667" y1="343" x2="667" y2="375" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="567" y="377" width="200" height="44" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="667" y="396" text-anchor="middle" font-size="12" font-weight="600" fill="#14532d">Формування та підпис</text>
  <text x="667" y="412" text-anchor="middle" font-size="12" font-weight="600" fill="#14532d">сертифіката КЕП</text>

  <!-- Arrow CA -> User (PIN) -->
  <path d="M 567 399 L 516 399 L 516 446 L 247 446" fill="none" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Action (User): Set PIN -->
  <rect x="45" y="424" width="200" height="44" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="145" y="443" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">Встановити 5-значний</text>
  <text x="145" y="459" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">PIN-код захисту</text>

  <!-- Arrow User -> App (Save Key) -->
  <line x1="245" y1="454" x2="303" y2="454" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Action (App): Save to Secure Enclave -->
  <rect x="305" y="432" width="195" height="44" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="402" y="451" text-anchor="middle" font-size="12" font-weight="600" fill="#78350f">Зберегти ключ у</text>
  <text x="402" y="467" text-anchor="middle" font-size="12" font-weight="600" fill="#78350f">Secure Enclave</text>

  <!-- Activity Final Node -->
  <line x1="402" y1="476" x2="402" y2="501" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <circle cx="402" cy="516" r="12" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <circle cx="402" cy="516" r="7.5" fill="#0f172a"/>
  <text x="456" y="520" font-size="12" font-weight="600" fill="#475569">Завершено</text>
</svg>
