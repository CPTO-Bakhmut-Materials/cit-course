<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="100%" height="auto" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="800" height="260" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Приклад критичного дисбалансу: «пляшкова шийка» (Bottleneck)</text>

  <!-- Node 1: Fast CPU -->
  <rect x="30" y="64" width="210" height="84" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="135" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Швидкий CPU</text>
  <text x="135" y="114" text-anchor="middle" font-size="12.5" fill="#1e293b">Intel Core i7 (16 ядер)</text>
  <text x="135" y="134" text-anchor="middle" font-size="11.5" font-weight="600" fill="#15803d">Потужний вузол (95% простою)</text>

  <!-- Arrow 1 -->
  <line x1="240" y1="106" x2="288" y2="106" stroke="#475569" stroke-width="2.4" marker-end="url(#arrow)"/>

  <!-- Node 2: Low RAM -->
  <rect x="294" y="64" width="212" height="84" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="400" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">4 ГБ повільної RAM</text>
  <text x="400" y="114" text-anchor="middle" font-size="12.5" fill="#1e293b">Одноканальний режим</text>
  <text x="400" y="134" text-anchor="middle" font-size="11.5" font-weight="600" fill="#b45309">Постійний дефіцит пам'яті</text>

  <!-- Arrow 2 -->
  <line x1="506" y1="106" x2="554" y2="106" stroke="#dc2626" stroke-width="2.4" marker-end="url(#arrow-red)"/>

  <!-- Node 3: Slow HDD -->
  <rect x="560" y="64" width="210" height="84" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="665" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">Повільний HDD</text>
  <text x="665" y="114" text-anchor="middle" font-size="12.5" fill="#1e293b">5400 RPM (затримка 15 мс)</text>
  <text x="665" y="134" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b91c1c">Критичне гальмо (I/O Wait)</text>

  <!-- Bottom Alert Banner -->
  <line x1="665" y1="148" x2="665" y2="180" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="120" y="180" width="560" height="54" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="400" y="203" text-anchor="middle" font-size="13.5" font-weight="700" fill="#991b1b">Пляшкова шийка системи!</text>
  <text x="400" y="223" text-anchor="middle" font-size="12" fill="#7f1d1d">Швидкість усієї робочої станції падає до рівня найповільнішого компонента (HDD та малої RAM)</text>
</svg>
