<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 350" width="100%" height="auto" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arrow-rev" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 10 1 L 0 5 L 10 9 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="840" height="350" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Архітектура інформаційної системи підприємства</text>

  <!-- Top Row -->
  <!-- Workstations -->
  <rect x="24" y="60" width="230" height="72" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="139" y="90" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">Робочі станції операторів</text>
  <text x="139" y="112" text-anchor="middle" font-size="11.5" fill="#1e40af">15 ПК відділів підприємства</text>

  <!-- Switch -->
  <rect x="304" y="60" width="232" height="72" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="420" y="90" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14532d">Мережевий комутатор</text>
  <text x="420" y="112" text-anchor="middle" font-size="11.5" fill="#166534">Керований L2 (VLAN 802.1Q)</text>

  <!-- Gateway -->
  <rect x="586" y="60" width="230" height="72" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="701" y="90" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">Шлюз / Маршрутизатор</text>
  <text x="701" y="112" text-anchor="middle" font-size="11.5" fill="#92400e">Firewall, NAT та VPN</text>

  <!-- Horizontal bidirectional arrows -->
  <line x1="258" y1="96" x2="298" y2="96" stroke="#334155" stroke-width="2" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>
  <line x1="540" y1="96" x2="580" y2="96" stroke="#334155" stroke-width="2" marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>

  <!-- Vertical arrows -->
  <line x1="420" y1="132" x2="420" y2="176" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="701" y1="132" x2="701" y2="176" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Server Infrastructure Box -->
  <rect x="24" y="182" width="512" height="144" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <rect x="24" y="182" width="512" height="36" rx="10" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="280" y="205" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Серверна інфраструктура (VLAN 20)</text>

  <rect x="42" y="232" width="226" height="36" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="155" y="255" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">Хмара документів (Nextcloud)</text>

  <rect x="292" y="232" width="226" height="36" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="405" y="255" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">Бізнес-система (ERP / CRM)</text>

  <rect x="42" y="278" width="226" height="36" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="155" y="301" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">Облік техніки та заявок (GLPI)</text>

  <rect x="292" y="278" width="226" height="36" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="405" y="301" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">Сховище бекапів (NAS 3-2-1)</text>

  <!-- Internet Box -->
  <rect x="586" y="182" width="230" height="144" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <rect x="586" y="182" width="230" height="36" rx="10" fill="#fecaca" stroke="#dc2626" stroke-width="1.8"/>
  <text x="701" y="205" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">Інтернет</text>
  <text x="701" y="250" text-anchor="middle" font-size="12.5" font-weight="600" fill="#991b1b">Зовнішні канали</text>
  <text x="701" y="272" text-anchor="middle" font-size="12" fill="#991b1b">Віддалені бекапи (Offsite)</text>
  <text x="701" y="294" text-anchor="middle" font-size="12" fill="#991b1b">Захищений доступ VPN</text>
</svg>
