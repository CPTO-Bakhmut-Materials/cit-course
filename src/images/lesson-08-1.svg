<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="820" height="430" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr-08-1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="820" height="430" fill="#f8fafc" rx="12" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Top Box -->
  <rect x="240" y="20" width="340" height="46" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="410" y="48" text-anchor="middle" font-size="16" font-weight="700" fill="#92400e">ДІАГРАМИ UML 2.5 (14 видів)</text>

  <!-- Branches -->
  <line x1="410" y1="66" x2="410" y2="86" stroke="#475569" stroke-width="2"/>
  <line x1="210" y1="86" x2="610" y2="86" stroke="#475569" stroke-width="2"/>
  <line x1="210" y1="86" x2="210" y2="106" stroke="#475569" stroke-width="2" marker-end="url(#arr-08-1)"/>
  <line x1="610" y1="86" x2="610" y2="106" stroke="#475569" stroke-width="2" marker-end="url(#arr-08-1)"/>

  <!-- Left Card: Структурні діаграми -->
  <rect x="28" y="112" width="366" height="296" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="28" y="112" width="366" height="40" rx="10" fill="#1e40af"/>
  <rect x="28" y="138" width="366" height="14" fill="#1e40af"/>
  <text x="211" y="137" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">СТРУКТУРНІ ДІАГРАМИ (7)</text>
  <text x="211" y="172" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">Статичний зріз системи:</text>
  <text x="211" y="188" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">архітектура, компоненти, зв'язки</text>

  <line x1="48" y1="200" x2="374" y2="200" stroke="#93c5fd" stroke-width="1.2"/>

  <text x="50" y="224" font-size="12.5" fill="#0f172a">1. Діаграма класів (Class)</text>
  <text x="50" y="249" font-size="12.5" fill="#0f172a">2. Діаграма об'єктів (Object)</text>
  <text x="50" y="274" font-size="12.5" fill="#0f172a">3. Діаграма компонентів (Component)</text>
  <text x="50" y="299" font-size="12.5" fill="#0f172a">4. Діаграма розгортання (Deployment)</text>
  <text x="50" y="324" font-size="12.5" fill="#0f172a">5. Діаграма пакетів (Package)</text>
  <text x="50" y="349" font-size="12.5" fill="#0f172a">6. Діаграма складеної структури (Composite)</text>
  <text x="50" y="374" font-size="12.5" fill="#0f172a">7. Діаграма профілів (Profile)</text>

  <!-- Right Card: Поведінкові діаграми -->
  <rect x="426" y="112" width="366" height="296" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <rect x="426" y="112" width="366" height="40" rx="10" fill="#166534"/>
  <rect x="426" y="138" width="366" height="14" fill="#166534"/>
  <text x="609" y="137" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">ПОВЕДІНКОВІ ДІАГРАМИ (7)</text>
  <text x="609" y="172" text-anchor="middle" font-size="12" font-weight="600" fill="#14532d">Динамічний зріз системи:</text>
  <text x="609" y="188" text-anchor="middle" font-size="12" font-weight="600" fill="#14532d">процеси, події, взаємодія</text>

  <line x1="446" y1="200" x2="772" y2="200" stroke="#86efac" stroke-width="1.2"/>

  <text x="448" y="224" font-size="12.5" font-weight="600" fill="#0f172a">1. Діаграма прецедентів (Use Case)</text>
  <text x="448" y="249" font-size="12.5" fill="#0f172a">2. Діаграма активності (Activity)</text>
  <text x="448" y="274" font-size="12.5" fill="#0f172a">3. Діаграма станів (State Machine)</text>
  <text x="448" y="299" font-size="12.5" font-weight="600" fill="#14532d">4. Діаграми взаємодії (4 види):</text>
  <text x="466" y="323" font-size="12" fill="#1e293b">• Діаграма послідовності (Sequence)</text>
  <text x="466" y="345" font-size="12" fill="#1e293b">• Діаграма комунікації (Communication)</text>
  <text x="466" y="367" font-size="12" fill="#1e293b">• Діаграма синхронізації (Timing)</text>
  <text x="466" y="389" font-size="12" fill="#1e293b">• Огляд взаємодії (Interaction Overview)</text>
</svg>
