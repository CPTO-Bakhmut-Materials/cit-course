<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="100%" height="auto" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="820" height="430" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="410" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Архітектура облікових записів, груп та sudo у Linux</text>

  <!-- Left Column: UID Categories -->
  <text x="28" y="58" font-size="12.5" font-weight="700" fill="#334155">Категорії за UID</text>

  <rect x="28" y="68" width="215" height="70" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="135" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">root (UID = 0)</text>
  <text x="135" y="109" text-anchor="middle" font-size="11.5" fill="#7f1d1d">Абсолютні права в системі</text>
  <text x="135" y="126" text-anchor="middle" font-size="11" fill="#7f1d1d">Прямий вхід обмежується</text>

  <rect x="28" y="150" width="215" height="72" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="135" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">Системні (UID 1–999)</text>
  <text x="135" y="191" text-anchor="middle" font-size="11.5" fill="#78350f">Служби: www-data, daemon</text>
  <text x="135" y="208" text-anchor="middle" font-size="11" fill="#78350f">Оболонка: /usr/sbin/nologin</text>

  <rect x="28" y="234" width="215" height="76" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="135" y="256" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Звичайні (UID 1000+)</text>
  <text x="135" y="275" text-anchor="middle" font-size="11.5" fill="#14532d">Співробітники (o_ivanenko)</text>
  <text x="135" y="292" text-anchor="middle" font-size="11" fill="#14532d">Каталог /home та /bin/bash</text>

  <!-- Connector from ordinary users to /etc/passwd -->
  <line x1="243" y1="272" x2="278" y2="112" stroke="#475569" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- Right Area: System Files -->
  <text x="286" y="58" font-size="12.5" font-weight="700" fill="#334155">Системні файли автентифікації (/etc/)</text>

  <!-- /etc/passwd -->
  <rect x="286" y="68" width="506" height="82" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="302" y="90" font-size="13.5" font-weight="700" fill="#1e3a8a">/etc/passwd (права 644 — читання всім)</text>
  <rect x="302" y="99" width="474" height="24" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="310" y="115" font-size="11.5" font-family="monospace" fill="#0f172a">o_ivanenko:<tspan font-weight="700" fill="#dc2626">x</tspan>:<tspan font-weight="700" fill="#2563eb">1001</tspan>:<tspan font-weight="700" fill="#16a34a">1001</tspan>:Бухгалтер:/home/o_ivanenko:/bin/bash</text>
  <text x="302" y="139" font-size="11" fill="#1e40af">Логін  |  Пароль (x)  |  UID  |  Первинна GID  |  GECOS  |  Дім  |  Оболонка</text>

  <!-- Arrows down from /etc/passwd -->
  <line x1="398" y1="150" x2="398" y2="176" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <line x1="650" y1="150" x2="650" y2="176" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- /etc/shadow -->
  <rect x="286" y="182" width="246" height="128" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="300" y="204" font-size="13" font-weight="700" fill="#991b1b">/etc/shadow (600 / 640)</text>
  <text x="300" y="223" font-size="11.5" font-weight="600" fill="#7f1d1d">Доступ лише для root!</text>
  <text x="300" y="244" font-size="11" fill="#7f1d1d">• Солений геш (SHA-512 / yescrypt)</text>
  <text x="300" y="263" font-size="11" fill="#7f1d1d">• Строк дії та попередження</text>
  <text x="300" y="282" font-size="11" fill="#7f1d1d">• Символ «!» = запис заблоковано</text>
  <text x="300" y="299" font-size="10.5" font-family="monospace" fill="#991b1b">usermod -L / usermod -U</text>

  <!-- /etc/group -->
  <rect x="546" y="182" width="246" height="128" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="560" y="204" font-size="13" font-weight="700" fill="#166534">/etc/group (групи та GID)</text>
  <text x="560" y="224" font-size="11" font-family="monospace" fill="#052e16">accounting:x:1003:o_ivanenko</text>
  <text x="560" y="246" font-size="11" fill="#14532d">• Первинна група — власник файлів</text>
  <text x="560" y="265" font-size="11" fill="#14532d">• Додаткові — спільні ресурси</text>
  <text x="560" y="284" font-size="11" fill="#14532d">• Додавання без перезапису:</text>
  <text x="560" y="300" font-size="10.5" font-family="monospace" fill="#166534">usermod -aG warehouse o_ivanenko</text>

  <!-- Bottom Banner: sudo workflow -->
  <rect x="28" y="330" width="764" height="82" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="44" y="352" font-size="13" font-weight="700" fill="#92400e">Механізм делегування привілеїв sudo (безпечна альтернатива прямому root)</text>

  <rect x="44" y="364" width="205" height="36" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.3"/>
  <text x="146" y="386" text-anchor="middle" font-size="11.5" font-weight="600" fill="#451a03">Адмін m_koval (група sudo)</text>

  <line x1="249" y1="382" x2="288" y2="382" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="294" y="364" width="230" height="36" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="409" y="386" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e3a8a">Свій пароль + /etc/sudoers (visudo)</text>

  <line x1="524" y1="382" x2="563" y2="382" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="569" y="364" width="207" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="672" y="386" text-anchor="middle" font-size="11.5" font-weight="600" fill="#166534">Права root + аудит у auth.log</text>
</svg>
