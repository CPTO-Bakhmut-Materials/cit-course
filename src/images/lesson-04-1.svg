<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="100%" height="auto" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="470" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Root Box -->
  <rect x="210" y="24" width="400" height="64" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.2"/>
  <text x="410" y="51" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">ІНФОРМАЦІЙНА СИСТЕМА (ІС)</text>
  <text x="410" y="73" text-anchor="middle" font-size="12.5" fill="#1e40af">Взаємодія 7 забезпечувальних підсистем</text>

  <!-- Connectors Root -> Row 1 -->
  <line x1="410" y1="88" x2="410" y2="112" stroke="#475569" stroke-width="2"/>
  <line x1="150" y1="112" x2="670" y2="112" stroke="#475569" stroke-width="2"/>
  <line x1="150" y1="112" x2="150" y2="132" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="112" x2="410" y2="132" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="670" y1="112" x2="670" y2="132" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 1 -->
  <rect x="35" y="138" width="230" height="72" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="150" y="166" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Технічне забезпечення</text>
  <text x="150" y="190" text-anchor="middle" font-size="12.5" fill="#172554">(Hardware: ПК, сервери, мережі)</text>

  <rect x="295" y="138" width="230" height="72" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="410" y="166" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">Програмне забезпечення</text>
  <text x="410" y="190" text-anchor="middle" font-size="12.5" fill="#052e16">(Software: ОС, СУБД, ПЗ)</text>

  <rect x="555" y="138" width="230" height="72" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="670" y="166" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Інформаційне забезпечення</text>
  <text x="670" y="190" text-anchor="middle" font-size="12.5" fill="#451a03">(БД, довідники, реєстри, файли)</text>

  <!-- Connectors Row 1 -> Row 2 -->
  <line x1="150" y1="210" x2="150" y2="232" stroke="#475569" stroke-width="2"/>
  <line x1="410" y1="210" x2="410" y2="232" stroke="#475569" stroke-width="2"/>
  <line x1="670" y1="210" x2="670" y2="232" stroke="#475569" stroke-width="2"/>
  <line x1="150" y1="232" x2="670" y2="232" stroke="#475569" stroke-width="2"/>
  <line x1="150" y1="232" x2="150" y2="252" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="232" x2="410" y2="252" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="670" y1="232" x2="670" y2="252" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 2 -->
  <rect x="35" y="258" width="230" height="72" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="150" y="286" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Організаційне забезп.</text>
  <text x="150" y="310" text-anchor="middle" font-size="12.5" fill="#451a03">(Інструкції, накази, регламенти)</text>

  <rect x="295" y="258" width="230" height="72" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="410" y="286" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">Правове забезпечення</text>
  <text x="410" y="310" text-anchor="middle" font-size="12.5" fill="#450a0a">(Ліцензії, захист таємниць)</text>

  <rect x="555" y="258" width="230" height="72" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="670" y="286" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Математичне / алгоритмічне</text>
  <text x="670" y="310" text-anchor="middle" font-size="12.5" fill="#172554">(Алгоритми, моделі, шифри)</text>

  <!-- Connector Row 2 -> Row 3 -->
  <line x1="150" y1="330" x2="150" y2="352" stroke="#475569" stroke-width="2"/>
  <line x1="410" y1="330" x2="410" y2="352" stroke="#475569" stroke-width="2"/>
  <line x1="670" y1="330" x2="670" y2="352" stroke="#475569" stroke-width="2"/>
  <line x1="150" y1="352" x2="670" y2="352" stroke="#475569" stroke-width="2"/>
  <line x1="410" y1="352" x2="410" y2="372" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Row 3 -->
  <rect x="275" y="378" width="270" height="72" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="410" y="406" text-anchor="middle" font-size="14.5" font-weight="700" fill="#166534">Кадрове забезпечення</text>
  <text x="410" y="430" text-anchor="middle" font-size="12.5" fill="#052e16">(Оператори, адміністратори, аналітики)</text>
</svg>
