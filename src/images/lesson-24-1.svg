<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="auto" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="800" height="400" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Фізичні середовища передачі даних</text>

  <!-- Card 1: Twisted Pair -->
  <rect x="24" y="54" width="236" height="322" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <rect x="24" y="54" width="236" height="44" rx="10" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="142" y="81" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e3a8a">1. Мідна вита пара</text>

  <!-- Mini icon: twisted pair / RJ-45 -->
  <rect x="52" y="110" width="180" height="44" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.3"/>
  <path d="M 70 132 Q 85 118 100 132 T 130 132 T 160 132 T 190 132" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <path d="M 70 132 Q 85 146 100 132 T 130 132 T 160 132 T 190 132" fill="none" stroke="#f97316" stroke-width="2.5"/>
  <text x="212" y="136" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">RJ-45</text>

  <text x="40" y="182" font-size="12.5" font-weight="600" fill="#1e3a8a">Стандарти швидкості:</text>
  <text x="40" y="204" font-size="12.5" fill="#172554">• Cat 5e: до 1 Гбіт/с (100 м)</text>
  <text x="40" y="226" font-size="12.5" fill="#172554">• Cat 6: 10 Гбіт/с (до 55 м)</text>
  <text x="40" y="248" font-size="12.5" fill="#172554">• Cat 6a: 10 Гбіт/с (до 100 м)</text>
  <text x="40" y="278" font-size="12.5" font-weight="600" fill="#1e3a8a">Екранування:</text>
  <text x="40" y="300" font-size="12.5" fill="#172554">• U/UTP, F/UTP, S/FTP</text>
  <text x="40" y="328" font-size="12" font-weight="600" fill="#1d4ed8">Підтримка живлення PoE</text>
  <text x="40" y="352" font-size="11.5" fill="#1e40af">Електричний сигнал • Локальні LAN</text>

  <!-- Card 2: Optical Fiber -->
  <rect x="282" y="54" width="236" height="322" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <rect x="282" y="54" width="236" height="44" rx="10" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.8"/>
  <text x="400" y="81" text-anchor="middle" font-size="14.5" font-weight="700" fill="#14532d">2. Оптичне волокно (ВОЛЗ)</text>

  <!-- Mini icon: light ray inside fiber core -->
  <rect x="310" y="110" width="180" height="44" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.3"/>
  <line x1="322" y1="120" x2="478" y2="120" stroke="#16a34a" stroke-width="2"/>
  <line x1="322" y1="144" x2="478" y2="144" stroke="#16a34a" stroke-width="2"/>
  <polyline points="326,132 356,122 386,142 416,122 446,142 474,132" fill="none" stroke="#eab308" stroke-width="2.4"/>

  <text x="298" y="182" font-size="12.5" font-weight="600" fill="#14532d">Одномодове (SMF, 9 мкм):</text>
  <text x="298" y="204" font-size="12.5" fill="#052e16">• Лазер 1310/1550 нм, 10–80 км</text>
  <text x="298" y="232" font-size="12.5" font-weight="600" fill="#14532d">Багатомодове (MMF, 50 мкм):</text>
  <text x="298" y="254" font-size="12.5" fill="#052e16">• LED/VCSEL 850 нм, 300–550 м</text>
  <text x="298" y="282" font-size="12.5" font-weight="600" fill="#14532d">Трансивери та переваги:</text>
  <text x="298" y="304" font-size="12.5" fill="#052e16">• Модулі SFP, SFP+, QSFP28</text>
  <text x="298" y="328" font-size="12" font-weight="600" fill="#15803d">Імунітет до завад і блискавок</text>
  <text x="298" y="352" font-size="11.5" fill="#166534">Світлові хвилі • Магістралі й ЦОД</text>

  <!-- Card 3: Wireless Wi-Fi -->
  <rect x="540" y="54" width="236" height="322" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <rect x="540" y="54" width="236" height="44" rx="10" fill="#fde68a" stroke="#d97706" stroke-width="1.8"/>
  <text x="658" y="81" text-anchor="middle" font-size="14.5" font-weight="700" fill="#78350f">3. Бездротові канали</text>

  <!-- Mini icon: Wi-Fi arcs -->
  <rect x="568" y="110" width="180" height="44" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.3"/>
  <circle cx="658" cy="144" r="3.5" fill="#d97706"/>
  <path d="M 647 136 A 14 14 0 0 1 669 136" fill="none" stroke="#d97706" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 638 128 A 26 26 0 0 1 678 128" fill="none" stroke="#d97706" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 629 120 A 38 38 0 0 1 687 120" fill="none" stroke="#d97706" stroke-width="2.2" stroke-linecap="round"/>

  <text x="556" y="182" font-size="12.5" font-weight="600" fill="#78350f">Стандарт Wi-Fi 6 (802.11ax):</text>
  <text x="556" y="204" font-size="12.5" fill="#451a03">• Діапазони: 2,4; 5 та 6 ГГц</text>
  <text x="556" y="226" font-size="12.5" fill="#451a03">• Швидкість до 9,6 Гбіт/с</text>
  <text x="556" y="254" font-size="12.5" font-weight="600" fill="#78350f">Захист та особливості:</text>
  <text x="556" y="276" font-size="12.5" fill="#451a03">• Шифрування WPA3-Enterprise</text>
  <text x="556" y="298" font-size="12.5" fill="#451a03">• Живлення точок через PoE+</text>
  <text x="556" y="328" font-size="12" font-weight="600" fill="#b45309">Повна мобільність клієнтів</text>
  <text x="556" y="352" font-size="11.5" fill="#92400e">Радіочастоти • Офіси, кампуси</text>
</svg>
