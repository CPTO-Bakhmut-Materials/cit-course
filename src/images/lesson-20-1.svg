<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" width="100%" height="auto" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="820" height="320" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="410" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Спеціалізація високопродуктивних робочих станцій</text>

  <!-- Row 1: Compute -->
  <rect x="28" y="58" width="236" height="72" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="146" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">1. Розрахункові станції</text>
  <text x="146" y="110" text-anchor="middle" font-size="12" fill="#1e40af">Data Science, САПР, CAE</text>
  <line x1="264" y1="94" x2="298" y2="94" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="304" y="58" width="488" height="72" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.6"/>
  <text x="322" y="86" font-size="13" font-weight="600" fill="#0f172a">12–32+ ядер CPU (Xeon / Threadripper), 64–128+ ГБ RAM (ECC)</text>
  <text x="322" y="110" font-size="12.5" fill="#334155">Векторні інструкції AVX-512, високошвидкісні шини PCIe 4.0 / 5.0</text>

  <!-- Row 2: Graphics -->
  <rect x="28" y="144" width="236" height="72" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="146" y="174" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">2. Графічні станції</text>
  <text x="146" y="196" text-anchor="middle" font-size="12" fill="#15803d">Blender, 3ds Max, 4K-монтаж</text>
  <line x1="264" y1="180" x2="298" y2="180" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="304" y="144" width="488" height="72" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.6"/>
  <text x="322" y="172" font-size="13" font-weight="600" fill="#0f172a">Потужний GPU з 12–24 ГБ VRAM, тензорні та RT-ядра</text>
  <text x="322" y="196" font-size="12.5" fill="#334155">Драйвери NVIDIA Studio, трьохрівнева дискова система, калібрований 4K IPS</text>

  <!-- Row 3: Gaming & GameDev -->
  <rect x="28" y="230" width="236" height="72" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="146" y="260" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">3. Ігрові та GameDev</text>
  <text x="146" y="282" text-anchor="middle" font-size="12" fill="#b45309">Unreal Engine 5, Unity, Ігри</text>
  <line x1="264" y1="266" x2="298" y2="266" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="304" y="230" width="488" height="72" rx="10" fill="#ffffff" stroke="#fcd34d" stroke-width="1.6"/>
  <text x="322" y="258" font-size="13" font-weight="600" fill="#0f172a">Швидкі ядра CPU з 3D V-Cache, пам'ять DDR5 із низькими таймінгами</text>
  <text x="322" y="282" font-size="12.5" fill="#334155">GPU з високим FPS, монітор 144–240 Гц (G-Sync / FreeSync)</text>
</svg>
