<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 350" width="820" height="350" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr-05-1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="820" height="350" fill="#f8fafc" rx="12" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Top Box -->
  <rect x="110" y="24" width="600" height="52" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="410" y="55" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">СТЕК ЦИФРОВИХ ТЕХНОЛОГІЙ ОПЕРАТОРА ІТ (4113)</text>

  <!-- Branch lines top -> middle -->
  <line x1="410" y1="76" x2="410" y2="98" stroke="#475569" stroke-width="2"/>
  <line x1="145" y1="98" x2="675" y2="98" stroke="#475569" stroke-width="2"/>
  <line x1="145" y1="98" x2="145" y2="118" stroke="#475569" stroke-width="2" marker-end="url(#arr-05-1)"/>
  <line x1="410" y1="98" x2="410" y2="118" stroke="#475569" stroke-width="2" marker-end="url(#arr-05-1)"/>
  <line x1="675" y1="98" x2="675" y2="118" stroke="#475569" stroke-width="2" marker-end="url(#arr-05-1)"/>

  <!-- Middle Card 1: Хмарні платформи -->
  <rect x="30" y="124" width="230" height="106" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <rect x="30" y="124" width="230" height="32" rx="10" fill="#166534"/>
  <rect x="30" y="144" width="230" height="12" fill="#166534"/>
  <text x="145" y="145" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Хмарні платформи</text>
  <text x="145" y="178" text-anchor="middle" font-size="12.5" font-weight="600" fill="#14532d">SaaS / PaaS / IaaS</text>
  <text x="145" y="198" text-anchor="middle" font-size="12" fill="#1e293b">Google Workspace,</text>
  <text x="145" y="215" text-anchor="middle" font-size="12" fill="#1e293b">Nextcloud, OneDrive</text>

  <!-- Middle Card 2: Юридичний е-документообіг -->
  <rect x="295" y="124" width="230" height="106" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <rect x="295" y="124" width="230" height="32" rx="10" fill="#b45309"/>
  <rect x="295" y="144" width="230" height="12" fill="#b45309"/>
  <text x="410" y="145" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Юридичний е-документообіг</text>
  <text x="410" y="178" text-anchor="middle" font-size="12.5" font-weight="600" fill="#78350f">Концепція Paperless</text>
  <text x="410" y="198" text-anchor="middle" font-size="12" fill="#1e293b">Кваліфікований електронний</text>
  <text x="410" y="215" text-anchor="middle" font-size="12" fill="#1e293b">підпис (КЕП), Дія.Підпис</text>

  <!-- Middle Card 3: Автоматизація рутини -->
  <rect x="560" y="124" width="230" height="106" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <rect x="560" y="124" width="230" height="32" rx="10" fill="#1e40af"/>
  <rect x="560" y="144" width="230" height="12" fill="#1e40af"/>
  <text x="675" y="145" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Автоматизація рутини</text>
  <text x="675" y="178" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">Сценарії та утиліти</text>
  <text x="675" y="198" text-anchor="middle" font-size="12" fill="#1e293b">Bash-скрипти, макроси,</text>
  <text x="675" y="215" text-anchor="middle" font-size="12" fill="#1e293b">пакетна обробка файлів</text>

  <!-- Merge lines middle -> bottom -->
  <line x1="145" y1="230" x2="145" y2="250" stroke="#475569" stroke-width="2"/>
  <line x1="410" y1="230" x2="410" y2="250" stroke="#475569" stroke-width="2"/>
  <line x1="675" y1="230" x2="675" y2="250" stroke="#475569" stroke-width="2"/>
  <line x1="145" y1="250" x2="675" y2="250" stroke="#475569" stroke-width="2"/>
  <line x1="410" y1="250" x2="410" y2="268" stroke="#475569" stroke-width="2" marker-end="url(#arr-05-1)"/>

  <!-- Bottom Box: Кібергігієна та безпека -->
  <rect x="60" y="274" width="700" height="54" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="410" y="297" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">Кібергігієна та безпека даних</text>
  <text x="410" y="317" text-anchor="middle" font-size="12.5" fill="#1e293b">Двофакторна автентифікація (2FA/MFA) • Менеджери паролів • Резервне копіювання «3-2-1»</text>
</svg>
