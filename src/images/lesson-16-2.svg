<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" font-family="system-ui, -apple-system, sans-serif">
  <rect width="780" height="330" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="390" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Два підходи до моделювання систем: draw.io та PlantUML</text>

  <!-- Left Card: GUI / draw.io -->
  <rect x="28" y="48" width="348" height="258" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="28" y="48" width="348" height="54" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="28" y="88" width="348" height="14" fill="#dbeafe"/>
  <line x1="28" y1="102" x2="376" y2="102" stroke="#2563eb" stroke-width="1.5"/>
  <text x="202" y="72" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">ВІЗУАЛЬНИЙ ПІДХІД (GUI)</text>
  <text x="202" y="92" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d4ed8">Інструмент: draw.io (diagrams.net)</text>

  <circle cx="48" cy="130" r="4" fill="#2563eb"/>
  <text x="62" y="134" font-size="12.5" fill="#1e293b">Інтерфейс Drag-and-Drop (робота мишею)</text>
  <circle cx="48" cy="164" r="4" fill="#2563eb"/>
  <text x="62" y="168" font-size="12.5" fill="#1e293b">Довільне розташування блоків на площині</text>
  <circle cx="48" cy="198" r="4" fill="#2563eb"/>
  <text x="62" y="202" font-size="12.5" fill="#1e293b">Зручно для швидких ескізів та схем</text>
  <circle cx="48" cy="232" r="4" fill="#2563eb"/>
  <text x="62" y="236" font-size="12.5" fill="#1e293b">Формати: .drawio, XML, SVG, PNG, PDF</text>
  <circle cx="48" cy="266" r="4" fill="#2563eb"/>
  <text x="62" y="270" font-size="12.5" fill="#1e293b">Вимагає ручного вирівнювання ліній</text>

  <!-- Right Card: Code / PlantUML -->
  <rect x="404" y="48" width="348" height="258" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="404" y="48" width="348" height="54" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <rect x="404" y="88" width="348" height="14" fill="#dcfce7"/>
  <line x1="404" y1="102" x2="752" y2="102" stroke="#16a34a" stroke-width="1.5"/>
  <text x="578" y="72" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">КОДОВИЙ ПІДХІД (Diagrams as Code)</text>
  <text x="578" y="92" text-anchor="middle" font-size="12.5" font-weight="600" fill="#15803d">Інструмент: PlantUML</text>

  <circle cx="424" cy="130" r="4" fill="#16a34a"/>
  <text x="438" y="134" font-size="12.5" fill="#1e293b">Текстовий декларативний опис моделі</text>
  <circle cx="424" cy="164" r="4" fill="#16a34a"/>
  <text x="438" y="168" font-size="12.5" fill="#1e293b">Автоматичне розміщення вузлів рушієм</text>
  <circle cx="424" cy="198" r="4" fill="#16a34a"/>
  <text x="438" y="202" font-size="12.5" fill="#1e293b">Зручно зберігати у Git поруч із кодом</text>
  <circle cx="424" cy="232" r="4" fill="#16a34a"/>
  <text x="438" y="236" font-size="12.5" fill="#1e293b">Простий текстовий файл .puml</text>
  <circle cx="424" cy="266" r="4" fill="#16a34a"/>
  <text x="438" y="270" font-size="12.5" fill="#1e293b">Автоматична генерація в CI/CD пайплайнах</text>
</svg>
