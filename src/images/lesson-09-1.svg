<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 315" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow-left" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 10 1 L 2 5 L 10 9 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="740" height="315" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="370" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Анатомія класу в нотації UML</text>

  <!-- Main UML Class Box -->
  <!-- Section 1: Class Name -->
  <rect x="36" y="54" width="336" height="46" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="204" y="83" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">Device</text>

  <!-- Section 2: Attributes -->
  <rect x="36" y="100" width="336" height="94" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="52" y="126" font-size="14" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">+ invNumber: String</text>
  <text x="52" y="152" font-size="14" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"># serialNumber: String</text>
  <text x="52" y="178" font-size="14" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">- purchaseCost: Decimal</text>

  <!-- Section 3: Operations -->
  <rect x="36" y="194" width="336" height="86" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="52" y="226" font-size="14" fill="#78350f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">+ getDeviceInfo(): String</text>
  <text x="52" y="254" font-size="14" fill="#78350f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">+ writeOff(): Boolean</text>

  <!-- Re-stroke outer border cleanly -->
  <rect x="36" y="54" width="336" height="226" rx="4" fill="none" stroke="#334155" stroke-width="2"/>
  <line x1="36" y1="100" x2="372" y2="100" stroke="#334155" stroke-width="1.8"/>
  <line x1="36" y1="194" x2="372" y2="194" stroke="#334155" stroke-width="1.8"/>

  <!-- Callout Arrows -->
  <line x1="428" y1="77" x2="380" y2="77" stroke="#475569" stroke-width="2" marker-end="url(#arrow-left)"/>
  <line x1="428" y1="147" x2="380" y2="147" stroke="#475569" stroke-width="2" marker-end="url(#arrow-left)"/>
  <line x1="428" y1="237" x2="380" y2="237" stroke="#475569" stroke-width="2" marker-end="url(#arrow-left)"/>

  <!-- Annotation Cards -->
  <rect x="430" y="54" width="274" height="46" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="444" y="82" font-size="14" font-weight="600" fill="#1e3a8a">1. Назва класу (PascalCase)</text>

  <rect x="430" y="113" width="274" height="68" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="444" y="140" font-size="14" font-weight="600" fill="#14532d">2. Атрибути (властивості, поля)</text>
  <text x="444" y="164" font-size="12.5" fill="#166534">Формат: видимість назва: тип</text>

  <rect x="430" y="201" width="274" height="72" rx="8" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="444" y="229" font-size="14" font-weight="600" fill="#78350f">3. Операції (методи, функції)</text>
  <text x="444" y="253" font-size="12.5" fill="#92400e">Формат: видимість назва(пар.): тип</text>
</svg>
