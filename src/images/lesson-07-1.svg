<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 350" width="820" height="350" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr-07-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e40af"/>
    </marker>
    <marker id="arr-07-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#15803d"/>
    </marker>
    <marker id="arr-07-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b45309"/>
    </marker>
    <marker id="arr-07-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect width="820" height="350" fill="#f8fafc" rx="12" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="410" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Функціональний блок IDEF0 та принцип ICOM</text>

  <!-- Control (Top) -->
  <rect x="275" y="48" width="270" height="50" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="410" y="69" text-anchor="middle" font-size="13.5" font-weight="700" fill="#92400e">КЕРУВАННЯ (Control)</text>
  <text x="410" y="88" text-anchor="middle" font-size="11.5" fill="#78350f">Закони, стандарти, інструкції, накази</text>
  <line x1="410" y1="98" x2="410" y2="128" stroke="#b45309" stroke-width="2.5" marker-end="url(#arr-07-amber)"/>

  <!-- Input (Left) -->
  <rect x="24" y="148" width="188" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="118" y="172" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14532d">ВХІД (Input)</text>
  <text x="118" y="191" text-anchor="middle" font-size="11.5" fill="#166534">Первинні дані, матеріали,</text>
  <text x="118" y="205" text-anchor="middle" font-size="11.5" fill="#166534">вхідні документи</text>
  <line x1="212" y1="180" x2="262" y2="180" stroke="#15803d" stroke-width="2.5" marker-end="url(#arr-07-green)"/>

  <!-- Functional Block (Center) -->
  <rect x="270" y="135" width="280" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.4"/>
  <text x="410" y="173" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1e3a8a">Функціональний блок</text>
  <text x="410" y="197" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">(Дія: дієслово або процес)</text>

  <!-- Output (Right) -->
  <line x1="550" y1="180" x2="600" y2="180" stroke="#1e40af" stroke-width="2.5" marker-end="url(#arr-07-blue)"/>
  <rect x="608" y="148" width="188" height="64" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="702" y="172" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14532d">ВИХІД (Output)</text>
  <text x="702" y="191" text-anchor="middle" font-size="11.5" fill="#166534">Оброблені дані, звіти,</text>
  <text x="702" y="205" text-anchor="middle" font-size="11.5" fill="#166534">акти, записи в БД</text>

  <!-- Mechanism (Bottom) -->
  <line x1="410" y1="262" x2="410" y2="232" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arr-07-red)"/>
  <rect x="260" y="264" width="300" height="58" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="410" y="287" text-anchor="middle" font-size="13.5" font-weight="700" fill="#991b1b">МЕХАНІЗМ (Mechanism)</text>
  <text x="410" y="307" text-anchor="middle" font-size="11.5" fill="#7f1d1d">Персонал (оператор ІПО), ПЗ, комп'ютер, сканер</text>
</svg>
