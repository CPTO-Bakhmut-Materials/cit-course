<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" width="100%" height="auto" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arrow-up" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 10 1 L 0 5 L 10 9 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="840" height="340" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Інтегрована архітектура ERP: єдина база даних і модулі</text>

  <!-- Central ERP DB -->
  <rect x="130" y="54" width="580" height="68" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="420" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">ЄДИНА РЕЛЯЦІЙНА БАЗА ДАНИХ ERP (PostgreSQL / MariaDB)</text>
  <text x="420" y="105" text-anchor="middle" font-size="12" fill="#1e40af">Актуальні дані без дублювання (Single Source of Truth) у режимі реального часу</text>

  <!-- Bidirectional arrows to 4 modules -->
  <line x1="210" y1="122" x2="118" y2="162" stroke="#334155" stroke-width="2" marker-start="url(#arrow-up)" marker-end="url(#arrow-dark)"/>
  <line x1="350" y1="122" x2="319" y2="162" stroke="#334155" stroke-width="2" marker-start="url(#arrow-up)" marker-end="url(#arrow-dark)"/>
  <line x1="490" y1="122" x2="521" y2="162" stroke="#334155" stroke-width="2" marker-start="url(#arrow-up)" marker-end="url(#arrow-dark)"/>
  <line x1="630" y1="122" x2="722" y2="162" stroke="#334155" stroke-width="2" marker-start="url(#arrow-up)" marker-end="url(#arrow-dark)"/>

  <!-- Module 1: Purchasing -->
  <rect x="24" y="168" width="188" height="148" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <rect x="24" y="168" width="188" height="36" rx="10" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.8"/>
  <text x="118" y="191" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">Закупівлі</text>
  <text x="118" y="226" text-anchor="middle" font-size="11.5" fill="#166534">Постачальники й прайси</text>
  <text x="118" y="246" text-anchor="middle" font-size="11.5" fill="#166534">Замовлення на закупівлю</text>
  <text x="118" y="266" text-anchor="middle" font-size="11.5" fill="#166534">Прибуткові накладні</text>
  <text x="118" y="298" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">Автопоповнення складу</text>

  <!-- Module 2: Warehouse -->
  <rect x="225" y="168" width="188" height="148" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <rect x="225" y="168" width="188" height="36" rx="10" fill="#fde68a" stroke="#d97706" stroke-width="1.8"/>
  <text x="319" y="191" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">Склад (WMS)</text>
  <text x="319" y="226" text-anchor="middle" font-size="11.5" fill="#92400e">Залишки й партії ТМЦ</text>
  <text x="319" y="246" text-anchor="middle" font-size="11.5" fill="#92400e">Серійні номери товарів</text>
  <text x="319" y="266" text-anchor="middle" font-size="11.5" fill="#92400e">Резервування й переміщення</text>
  <text x="319" y="298" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">Контроль в режимі 24/7</text>

  <!-- Module 3: Sales & CRM -->
  <rect x="427" y="168" width="188" height="148" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <rect x="427" y="168" width="188" height="36" rx="10" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="521" y="191" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Продажі та CRM</text>
  <text x="521" y="226" text-anchor="middle" font-size="11.5" fill="#1e40af">Ліди й воронка угод</text>
  <text x="521" y="246" text-anchor="middle" font-size="11.5" fill="#1e40af">Комерційні пропозиції</text>
  <text x="521" y="266" text-anchor="middle" font-size="11.5" fill="#1e40af">Замовлення та відвантаження</text>
  <text x="521" y="298" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">Історія взаємодії з клієнтом</text>

  <!-- Module 4: Finance -->
  <rect x="628" y="168" width="188" height="148" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <rect x="628" y="168" width="188" height="36" rx="10" fill="#fecaca" stroke="#dc2626" stroke-width="1.8"/>
  <text x="722" y="191" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">Фінанси та облік</text>
  <text x="722" y="226" text-anchor="middle" font-size="11.5" fill="#991b1b">Рахунки-фактури (Invoices)</text>
  <text x="722" y="246" text-anchor="middle" font-size="11.5" fill="#991b1b">Контроль оплат і боргів</text>
  <text x="722" y="266" text-anchor="middle" font-size="11.5" fill="#991b1b">Бухгалтерська звітність</text>
  <text x="722" y="298" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">Єдина фінансова картина</text>
</svg>
