<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 345" width="100%" height="auto" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="osi-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="780" height="345" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="390" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Мережеве обладнання за рівнями моделі OSI (L1–L3)</text>

  <!-- Left vertical bidirectional axis -->
  <line x1="48" y1="74" x2="48" y2="306" stroke="#475569" stroke-width="2.2" marker-start="url(#osi-arrow)" marker-end="url(#osi-arrow)"/>
  <text x="30" y="190" text-anchor="middle" font-size="12" font-weight="700" fill="#334155" transform="rotate(-90 30 190)">Потік даних (L1 ↔ L3)</text>

  <!-- Level 3: Network -->
  <rect x="74" y="60" width="190" height="74" rx="8" fill="#fecaca" stroke="#dc2626" stroke-width="1.8"/>
  <text x="169" y="92" text-anchor="middle" font-size="15" font-weight="700" fill="#7f1d1d">Рівень 3 (L3)</text>
  <text x="169" y="114" text-anchor="middle" font-size="13" font-weight="600" fill="#991b1b">Мережевий рівень</text>

  <line x1="264" y1="97" x2="296" y2="97" stroke="#475569" stroke-width="2" marker-end="url(#osi-arrow)"/>

  <rect x="302" y="60" width="454" height="74" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="320" y="88" font-size="15" font-weight="700" fill="#7f1d1d">Маршрутизатор (Router)</text>
  <text x="320" y="112" font-size="13" fill="#450a0a">Оперує логічними IP-адресами, пакетами, NAT і Firewall</text>

  <!-- Level 2: Data Link -->
  <rect x="74" y="152" width="190" height="74" rx="8" fill="#fde68a" stroke="#d97706" stroke-width="1.8"/>
  <text x="169" y="184" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">Рівень 2 (L2)</text>
  <text x="169" y="206" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">Канальний рівень</text>

  <line x1="264" y1="189" x2="296" y2="189" stroke="#475569" stroke-width="2" marker-end="url(#osi-arrow)"/>

  <rect x="302" y="152" width="454" height="74" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="320" y="180" font-size="15" font-weight="700" fill="#78350f">Комутатор (Switch L2)</text>
  <text x="320" y="204" font-size="13" fill="#451a03">Оперує MAC-адресами, кадрами Ethernet, VLAN 802.1Q та PoE</text>

  <!-- Level 1: Physical -->
  <rect x="74" y="244" width="190" height="74" rx="8" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="169" y="276" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Рівень 1 (L1)</text>
  <text x="169" y="298" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8">Фізичний рівень</text>

  <line x1="264" y1="281" x2="296" y2="281" stroke="#475569" stroke-width="2" marker-end="url(#osi-arrow)"/>

  <rect x="302" y="244" width="454" height="74" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="320" y="272" font-size="15" font-weight="700" fill="#1e3a8a">Патч-панель / Медіаконвертер / Кабель</text>
  <text x="320" y="296" font-size="13" fill="#172554">Передає біти даних у вигляді електричних чи світлових імпульсів</text>
</svg>
