<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 370" width="100%" height="auto" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="820" height="370" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="410" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Архітектура LVM (Logical Volume Manager)</text>

  <!-- Physical Volumes (PV) -->
  <rect x="60" y="56" width="310" height="68" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="215" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Фізичний том 1 (PV)</text>
  <text x="215" y="106" text-anchor="middle" font-size="12.5" fill="#1e40af">Диск /dev/sda2 — 100 ГБ</text>

  <rect x="450" y="56" width="310" height="68" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="605" y="84" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Фізичний том 2 (PV)</text>
  <text x="605" y="106" text-anchor="middle" font-size="12.5" fill="#1e40af">Диск /dev/sdb1 — 200 ГБ</text>

  <line x1="215" y1="124" x2="320" y2="154" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="605" y1="124" x2="500" y2="154" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- Volume Group (VG) -->
  <rect x="130" y="160" width="560" height="72" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="410" y="190" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">Група томів (Volume Group): «server-vg» — 300 ГБ</text>
  <text x="410" y="213" text-anchor="middle" font-size="12.5" fill="#b45309">Єдиний віртуальний пул дискового простору з фізичних носіїв</text>

  <line x1="280" y1="232" x2="175" y2="264" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="410" y1="232" x2="410" y2="264" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="540" y1="232" x2="655" y2="264" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- Logical Volumes (LV) & Free Pool -->
  <rect x="40" y="270" width="250" height="78" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="165" y="297" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Логічний том 1: root-lv</text>
  <text x="165" y="317" text-anchor="middle" font-size="12.5" fill="#15803d">Розмір: 50 ГБ (ФС ext4)</text>
  <text x="165" y="335" text-anchor="middle" font-size="11.5" fill="#166534">Розширюється без зупинки ОС</text>

  <rect x="305" y="270" width="250" height="78" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="430" y="297" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Логічний том 2: data-lv</text>
  <text x="430" y="317" text-anchor="middle" font-size="12.5" fill="#15803d">Розмір: 200 ГБ (ФС ext4)</text>
  <text x="430" y="335" text-anchor="middle" font-size="11.5" fill="#166534">Сховище робочих даних і БД</text>

  <rect x="570" y="270" width="210" height="78" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="675" y="297" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">Вільний залишок VG</text>
  <text x="675" y="317" text-anchor="middle" font-size="12.5" fill="#b91c1c">50 ГБ у резерві</text>
  <text x="675" y="335" text-anchor="middle" font-size="11.5" fill="#991b1b">Для lvextend або знімків</text>
</svg>
