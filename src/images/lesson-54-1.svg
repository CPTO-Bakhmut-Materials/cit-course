<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 310" width="100%" height="auto" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="840" height="310" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Екосистема корпоративної хмари Nextcloud Hub</text>

  <!-- Top Hub Box -->
  <rect x="190" y="52" width="460" height="58" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="1.8"/>
  <text x="420" y="77" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">ЕКОСИСТЕМА NEXTCLOUD HUB</text>
  <text x="420" y="98" text-anchor="middle" font-size="12" fill="#334155">Приватна хмара підприємства • 100% контроль та суверенітет даних</text>

  <!-- Arrows -->
  <line x1="250" y1="110" x2="118" y2="146" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="360" y1="110" x2="319" y2="146" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="110" x2="521" y2="146" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="110" x2="722" y2="146" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Files -->
  <rect x="24" y="152" width="188" height="134" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <rect x="24" y="152" width="188" height="36" rx="10" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="118" y="175" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">Files</text>
  <text x="118" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">Файлове сховище</text>
  <text x="118" y="234" text-anchor="middle" font-size="11.5" fill="#1e40af">Синхронізація, WebDAV</text>
  <text x="118" y="254" text-anchor="middle" font-size="11.5" fill="#1e40af">Контроль версій файлів</text>
  <text x="118" y="274" text-anchor="middle" font-size="11.5" fill="#1e40af">Захищені посилання</text>

  <!-- Groupware -->
  <rect x="225" y="152" width="188" height="134" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <rect x="225" y="152" width="188" height="36" rx="10" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.8"/>
  <text x="319" y="175" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14532d">Groupware</text>
  <text x="319" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Органайзер команди</text>
  <text x="319" y="234" text-anchor="middle" font-size="11.5" fill="#166534">Корпоративна пошта</text>
  <text x="319" y="254" text-anchor="middle" font-size="11.5" fill="#166534">Календарі (CalDAV)</text>
  <text x="319" y="274" text-anchor="middle" font-size="11.5" fill="#166534">Контакти (CardDAV)</text>

  <!-- Office -->
  <rect x="427" y="152" width="188" height="134" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <rect x="427" y="152" width="188" height="36" rx="10" fill="#fde68a" stroke="#d97706" stroke-width="1.8"/>
  <text x="521" y="175" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">Office</text>
  <text x="521" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Спільна робота</text>
  <text x="521" y="234" text-anchor="middle" font-size="11.5" fill="#92400e">Collabora Online</text>
  <text x="521" y="254" text-anchor="middle" font-size="11.5" fill="#92400e">ONLYOFFICE</text>
  <text x="521" y="274" text-anchor="middle" font-size="11.5" fill="#92400e">Редагування в реальному часі</text>

  <!-- Talk -->
  <rect x="628" y="152" width="188" height="134" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <rect x="628" y="152" width="188" height="36" rx="10" fill="#fecaca" stroke="#dc2626" stroke-width="1.8"/>
  <text x="722" y="175" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7f1d1d">Talk</text>
  <text x="722" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">Комунікації</text>
  <text x="722" y="234" text-anchor="middle" font-size="11.5" fill="#991b1b">Корпоративні чати</text>
  <text x="722" y="254" text-anchor="middle" font-size="11.5" fill="#991b1b">Аудіо- та відеодзвінки</text>
  <text x="722" y="274" text-anchor="middle" font-size="11.5" fill="#991b1b">Онлайн-наради</text>
</svg>
