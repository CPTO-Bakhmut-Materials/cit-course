<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="auto" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="800" height="300" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Структура корпоративного сховища підприємства</text>

  <!-- Root Folder -->
  <rect x="30" y="132" width="210" height="72" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="135" y="164" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">/Nextcloud_Root</text>
  <text x="135" y="185" text-anchor="middle" font-size="12" fill="#1e40af">Кореневий каталог</text>

  <!-- Branches -->
  <path d="M 240 168 L 285 168 L 285 90 L 324 90" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="240" y1="168" x2="324" y2="168" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 240 168 L 285 168 L 285 246 L 324 246" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Folder 1 -->
  <rect x="330" y="56" width="440" height="66" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="350" y="82" font-size="14" font-weight="700" fill="#14532d">01_Загальне</text>
  <text x="350" y="104" font-size="12" fill="#166534">Доступ: Всі працівники • Тільки читання (бланки, шаблони, інструкції)</text>

  <!-- Folder 2 -->
  <rect x="330" y="135" width="440" height="66" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="350" y="161" font-size="14" font-weight="700" fill="#7f1d1d">02_Бухгалтерія</text>
  <text x="350" y="183" font-size="12" fill="#991b1b">Доступ: Бухгалтери • Повний доступ (фінансові звіти, акти, накладні)</text>

  <!-- Folder 3 -->
  <rect x="330" y="214" width="440" height="66" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="350" y="240" font-size="14" font-weight="700" fill="#78350f">03_Договори_Клієнти</text>
  <text x="350" y="262" font-size="12" fill="#92400e">Доступ: Менеджери та Оператори • Контракти, прайс-листи</text>
</svg>
