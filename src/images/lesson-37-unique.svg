<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 450" width="100%" height="auto" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="450" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title -->
  <text x="410" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Клієнт-серверна архітектура СУБД та розмежування доступу</text>

  <!-- Column Headers -->
  <text x="135" y="64" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">КЛІЄНТСЬКІ ПРОГРАМИ</text>
  <text x="410" y="64" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">МЕРЕЖЕВИЙ ШЛЮЗ І БЕЗПЕКА</text>
  <text x="675" y="64" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">СЕРВЕР БАЗ ДАНИХ (DAEMON)</text>

  <!-- Left Column: Clients -->
  <rect x="24" y="80" width="222" height="86" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="135" y="103" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">Вебзастосунок / Сайт</text>
  <text x="135" y="123" text-anchor="middle" font-size="12" fill="#172554">Користувач: operator_user</text>
  <text x="135" y="141" text-anchor="middle" font-size="11.5" fill="#1e40af">Права: SELECT, INSERT, UPDATE</text>
  <text x="135" y="157" text-anchor="middle" font-size="11" fill="#475569">(без прав DROP чи CREATE USER)</text>

  <rect x="24" y="182" width="222" height="86" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="135" y="205" text-anchor="middle" font-size="13.5" font-weight="700" fill="#166534">Консоль та GUI-інструменти</text>
  <text x="135" y="225" text-anchor="middle" font-size="12" fill="#052e16">Клієнти: mariadb, psql</text>
  <text x="135" y="243" text-anchor="middle" font-size="11.5" fill="#15803d">phpMyAdmin, pgAdmin, DBeaver</text>
  <text x="135" y="259" text-anchor="middle" font-size="11" fill="#475569">Резервування: mariadb-dump</text>

  <rect x="24" y="284" width="222" height="82" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="135" y="307" text-anchor="middle" font-size="13.5" font-weight="700" fill="#991b1b">Несанкціонований доступ</text>
  <text x="135" y="327" text-anchor="middle" font-size="12" fill="#7f1d1d">Віддалений вхід під root</text>
  <text x="135" y="345" text-anchor="middle" font-size="11.5" fill="#991b1b">Анонімні користувачі, база test</text>
  <text x="135" y="360" text-anchor="middle" font-size="11" font-weight="700" fill="#dc2626">ЗАБЛОКОВАНО безпекою</text>

  <!-- Middle Column: Security & Network Socket -->
  <rect x="304" y="80" width="212" height="286" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="410" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Мережевий сокет і захист</text>

  <rect x="312" y="122" width="196" height="68" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
  <text x="410" y="142" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">bind-address = 127.0.0.1</text>
  <text x="410" y="160" text-anchor="middle" font-size="11.5" fill="#451a03">Прийом запитів лише локально</text>
  <text x="410" y="177" text-anchor="middle" font-size="10.5" fill="#78350f">(для мережі: 0.0.0.0 + фаєрвол ufw)</text>

  <rect x="312" y="202" width="196" height="68" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
  <text x="410" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Аудит і найменші привілеї</text>
  <text x="410" y="240" text-anchor="middle" font-size="11.5" fill="#451a03">mariadb-secure-installation</text>
  <text x="410" y="257" text-anchor="middle" font-size="11" fill="#78350f">GRANT ... ON company_db.*</text>

  <rect x="312" y="282" width="196" height="68" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="410" y="303" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">Блокування загроз</text>
  <text x="410" y="321" text-anchor="middle" font-size="11.5" fill="#7f1d1d">Disallow root login remotely</text>
  <text x="410" y="338" text-anchor="middle" font-size="11" fill="#991b1b">Access denied при DROP TABLE</text>

  <!-- Right Column: DBMS Engines -->
  <rect x="562" y="80" width="234" height="134" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="679" y="105" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e3a8a">MariaDB (RDBMS)</text>
  <text x="679" y="126" text-anchor="middle" font-size="12" font-weight="600" fill="#1d4ed8">TCP порт: 3306 | mariadb.service</text>
  <text x="679" y="147" text-anchor="middle" font-size="11.5" fill="#172554">• Рушій InnoDB, висока швидкість</text>
  <text x="679" y="165" text-anchor="middle" font-size="11.5" fill="#172554">• Сумісність із MySQL (GPLv2)</text>
  <text x="679" y="183" text-anchor="middle" font-size="11.5" fill="#172554">• Основа стеків LAMP / LEMP</text>
  <text x="679" y="201" text-anchor="middle" font-size="11.5" fill="#172554">• Адмін-обліковка: root</text>

  <rect x="562" y="232" width="234" height="134" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="679" y="257" text-anchor="middle" font-size="14.5" font-weight="700" fill="#166534">PostgreSQL (ORDBMS)</text>
  <text x="679" y="278" text-anchor="middle" font-size="12" font-weight="600" fill="#15803d">TCP порт: 5432 | postgresql.service</text>
  <text x="679" y="299" text-anchor="middle" font-size="11.5" fill="#052e16">• Об'єктно-реляційне сховище MVCC</text>
  <text x="679" y="317" text-anchor="middle" font-size="11.5" fill="#052e16">• Складні запити та стандарти SQL</text>
  <text x="679" y="335" text-anchor="middle" font-size="11.5" fill="#052e16">• Підтримка JSON/JSONB, PostGIS</text>
  <text x="679" y="353" text-anchor="middle" font-size="11.5" fill="#052e16">• Адмін-обліковка: postgres</text>

  <!-- Arrows Left -> Middle -->
  <line x1="246" y1="123" x2="296" y2="148" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="246" y1="225" x2="296" y2="225" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="246" y1="325" x2="296" y2="325" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow-red)"/>
  <line x1="267" y1="315" x2="279" y2="335" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="279" y1="315" x2="267" y2="335" stroke="#dc2626" stroke-width="2.5"/>

  <!-- Arrows Middle -> Right -->
  <line x1="516" y1="156" x2="554" y2="147" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <line x1="516" y1="236" x2="554" y2="292" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow-green)"/>

  <!-- Bottom Bar: ACID -->
  <rect x="24" y="384" width="772" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="410" y="403" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Гарантія надійності транзакцій — принципи ACID</text>
  <text x="410" y="421" text-anchor="middle" font-size="12" fill="#172554">A (Атомарність: усе або нічого)  •  C (Узгодженість даних)  •  I (Ізольованість паралельних запитів)  •  D (Довговічність на диску)</text>
</svg>
