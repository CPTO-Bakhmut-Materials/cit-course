<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 445" width="100%" height="auto" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="flow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="780" height="445" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="390" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Архітектура взаємодії: драйвери та диспетчер черги друку</text>

  <!-- Left zone indicators -->
  <rect x="24" y="58" width="134" height="128" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.3"/>
  <text x="91" y="114" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e40af">Простір</text>
  <text x="91" y="132" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e40af">користувача</text>
  <text x="91" y="150" text-anchor="middle" font-size="11" fill="#3b82f6">(User Space)</text>

  <rect x="24" y="200" width="134" height="146" rx="8" fill="#fefce8" stroke="#fcd34d" stroke-width="1.3"/>
  <text x="91" y="264" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">Системний</text>
  <text x="91" y="282" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">прошарок</text>
  <text x="91" y="300" text-anchor="middle" font-size="11" fill="#b45309">(Драйвер / PDL)</text>

  <rect x="24" y="360" width="134" height="62" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.3"/>
  <text x="91" y="388" text-anchor="middle" font-size="12.5" font-weight="700" fill="#991b1b">Апаратний</text>
  <text x="91" y="406" text-anchor="middle" font-size="12.5" font-weight="700" fill="#991b1b">рівень</text>

  <!-- Stage 1 -->
  <rect x="180" y="58" width="576" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="468" y="81" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e3a8a">1. Прикладна програма (LibreOffice, браузер, PDF-переглядач)</text>
  <text x="468" y="100" text-anchor="middle" font-size="12" fill="#172554">Користувач натискає «Друк» (Ctrl+P) — формується завдання</text>

  <line x1="468" y1="110" x2="468" y2="128" stroke="#334155" stroke-width="2.2" marker-end="url(#flow-arrow)"/>

  <!-- Stage 2 -->
  <rect x="180" y="134" width="576" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="468" y="157" text-anchor="middle" font-size="14.5" font-weight="700" fill="#14532d">2. Підсистема черги друку (CUPS у Linux / Print Spooler у Windows)</text>
  <text x="468" y="176" text-anchor="middle" font-size="12" fill="#052e16">Зберігає проміжний spool-файл на диск і передає сторінки у фоновому режимі</text>

  <line x1="468" y1="186" x2="468" y2="204" stroke="#334155" stroke-width="2.2" marker-end="url(#flow-arrow)"/>

  <!-- Stage 3 -->
  <rect x="180" y="210" width="576" height="52" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="468" y="233" text-anchor="middle" font-size="14.5" font-weight="700" fill="#78350f">3. Драйвер пристрою (Device Driver)</text>
  <text x="468" y="252" text-anchor="middle" font-size="12" fill="#451a03">Перетворює абстрактний документ у бінарні мікрокоманди конкретної моделі принтера</text>

  <line x1="468" y1="262" x2="468" y2="280" stroke="#334155" stroke-width="2.2" marker-end="url(#flow-arrow)"/>

  <!-- Stage 4 -->
  <rect x="180" y="286" width="576" height="52" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="468" y="309" text-anchor="middle" font-size="14.5" font-weight="700" fill="#78350f">4. Мова опису сторінок (PDL): PostScript / PCL / ESC/POS</text>
  <text x="468" y="328" text-anchor="middle" font-size="12" fill="#451a03">Уніфікований потік інструкцій розмітки тексту, шрифтів, векторної графіки або чеків</text>

  <line x1="468" y1="338" x2="468" y2="356" stroke="#334155" stroke-width="2.2" marker-end="url(#flow-arrow)"/>

  <!-- Stage 5 -->
  <rect x="180" y="362" width="576" height="58" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="468" y="386" text-anchor="middle" font-size="14.5" font-weight="700" fill="#7f1d1d">5. Апаратний порт та фізичний пристрій</text>
  <text x="468" y="406" text-anchor="middle" font-size="12" fill="#450a0a">Шина USB або мережа Ethernet (протоколи IPP / Raw TCP порт 9100) → Друк на папері</text>
</svg>
