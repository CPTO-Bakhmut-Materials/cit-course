<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 390" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#1e293b"/>
    </marker>
  </defs>

  <rect width="780" height="390" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="390" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Умовне розгалуження (Decision / Merge) проти паралелізму (Fork / Join)</text>

  <!-- Left Panel: Decision / Merge -->
  <rect x="20" y="46" width="355" height="324" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="197" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Decision / Merge (Вибір — логічне АБО)</text>

  <line x1="197" y1="82" x2="197" y2="112" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <polygon points="197,114 221,134 197,154 173,134" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="197" y="138" text-anchor="middle" font-size="11" font-weight="700" fill="#78350f">?</text>

  <path d="M 173 134 L 105 134 L 105 183" fill="none" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="135" y="126" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e3a8a">[умова 1]</text>

  <path d="M 221 134 L 290 134 L 290 183" fill="none" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="260" y="126" text-anchor="middle" font-size="11.5" font-weight="600" fill="#b45309">[умова 2]</text>

  <rect x="50" y="185" width="110" height="42" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="105" y="211" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Дія А</text>

  <rect x="235" y="185" width="110" height="42" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="290" y="211" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">Дія Б</text>

  <path d="M 105 227 L 105 276 L 171 276" fill="none" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 290 227 L 290 276 L 223 276" fill="none" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>

  <polygon points="197,256 221,276 197,296 173,276" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <line x1="197" y1="296" x2="197" y2="326" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>

  <text x="197" y="352" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">Виконується ЛИШЕ ОДНА гілка</text>

  <!-- Right Panel: Fork / Join -->
  <rect x="405" y="46" width="355" height="324" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="582" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Fork / Join (Паралельність — логічне І)</text>

  <line x1="582" y1="82" x2="582" y2="122" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="462" y="124" width="240" height="9" rx="3" fill="#0f172a"/>
  <text x="650" y="114" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">Вузол Fork</text>

  <line x1="510" y1="133" x2="510" y2="183" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="654" y1="133" x2="654" y2="183" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="455" y="185" width="110" height="42" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="510" y="211" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">Дія 1</text>

  <rect x="599" y="185" width="110" height="42" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="654" y="211" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">Дія 2</text>

  <text x="582" y="210" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">∥</text>

  <line x1="510" y1="227" x2="510" y2="272" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="654" y1="227" x2="654" y2="272" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="462" y="274" width="240" height="9" rx="3" fill="#0f172a"/>
  <text x="654" y="302" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">Вузол Join</text>

  <line x1="582" y1="283" x2="582" y2="326" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="582" y="352" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">Очікує завершення ВСІХ паралельних дій</text>
</svg>
