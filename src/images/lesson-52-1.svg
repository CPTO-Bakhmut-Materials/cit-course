<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="100%" height="auto" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="840" height="330" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Життєвий цикл електронного документа в системі СЕД</text>

  <!-- Row 1: Stage 1 -> Stage 2 -> Stage 3 -->
  <rect x="32" y="60" width="230" height="96" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <rect x="32" y="60" width="230" height="32" rx="10" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="147" y="81" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">1. Створення проєкту</text>
  <text x="147" y="114" text-anchor="middle" font-size="11.5" fill="#1e40af">Підготовка тексту та реквізитів</text>
  <text x="147" y="133" text-anchor="middle" font-size="11.5" fill="#1e40af">згідно зі стандартом ДСТУ 4163:2020</text>

  <line x1="262" y1="108" x2="299" y2="108" stroke="#334155" stroke-width="2" marker-end="url(#arrow-dark)"/>

  <rect x="305" y="60" width="230" height="96" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <rect x="305" y="60" width="230" height="32" rx="10" fill="#fde68a" stroke="#d97706" stroke-width="1.8"/>
  <text x="420" y="81" text-anchor="middle" font-size="12.5" font-weight="700" fill="#78350f">2. Маршрут погодження</text>
  <text x="420" y="114" text-anchor="middle" font-size="11.5" fill="#92400e">Візування документа колегами,</text>
  <text x="420" y="133" text-anchor="middle" font-size="11.5" fill="#92400e">фіксація зауважень і правок</text>

  <line x1="535" y1="108" x2="572" y2="108" stroke="#334155" stroke-width="2" marker-end="url(#arrow-dark)"/>

  <rect x="578" y="60" width="230" height="96" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <rect x="578" y="60" width="230" height="32" rx="10" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.8"/>
  <text x="693" y="81" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14532d">3. Підписання (КЕП)</text>
  <text x="693" y="114" text-anchor="middle" font-size="11.5" fill="#166534">Накладання КЕП керівником</text>
  <text x="693" y="133" text-anchor="middle" font-size="11.5" fill="#166534">та позначки точного часу (TSP)</text>

  <!-- Connector from Stage 3 down-left to Stage 4 -->
  <path d="M 693 156 L 693 178 L 147 178 L 147 196" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow-dark)"/>

  <!-- Row 2: Stage 4 -> Stage 5 -> Stage 6 -->
  <rect x="32" y="202" width="230" height="96" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <rect x="32" y="202" width="230" height="32" rx="10" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="147" y="223" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">4. Реєстрація в РКК</text>
  <text x="147" y="256" text-anchor="middle" font-size="11.5" fill="#1e40af">Присвоєння індексу, занесення</text>
  <text x="147" y="275" text-anchor="middle" font-size="11.5" fill="#1e40af">метаданих і гешу SHA-256</text>

  <line x1="262" y1="250" x2="299" y2="250" stroke="#334155" stroke-width="2" marker-end="url(#arrow-dark)"/>

  <rect x="305" y="202" width="230" height="96" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <rect x="305" y="202" width="230" height="32" rx="10" fill="#fde68a" stroke="#d97706" stroke-width="1.8"/>
  <text x="420" y="223" text-anchor="middle" font-size="12.5" font-weight="700" fill="#78350f">5. Контроль виконання</text>
  <text x="420" y="256" text-anchor="middle" font-size="11.5" fill="#92400e">Призначення відповідального</text>
  <text x="420" y="275" text-anchor="middle" font-size="11.5" fill="#92400e">та відстеження терміну резолюції</text>

  <line x1="535" y1="250" x2="572" y2="250" stroke="#334155" stroke-width="2" marker-end="url(#arrow-dark)"/>

  <rect x="578" y="202" width="230" height="96" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <rect x="578" y="202" width="230" height="32" rx="10" fill="#fecaca" stroke="#dc2626" stroke-width="1.8"/>
  <text x="693" y="223" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7f1d1d">6. Цифровий архів</text>
  <text x="693" y="256" text-anchor="middle" font-size="11.5" fill="#991b1b">Зберігання у форматі PDF/A</text>
  <text x="693" y="275" text-anchor="middle" font-size="11.5" fill="#991b1b">(ISO 19005) або знищення за актом</text>
</svg>
