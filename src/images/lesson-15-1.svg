<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" font-family="system-ui, -apple-system, sans-serif">
  <rect width="780" height="340" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="390" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Типи кардинальності зв'язків у нотації «Вороняча лапка» (Crow's Foot)</text>

  <!-- Row 1: 1:1 -->
  <rect x="24" y="48" width="732" height="82" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="38" y="64" width="66" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="71" y="95" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">1 : 1</text>

  <rect x="130" y="68" width="128" height="42" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="194" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Громадянин</text>

  <!-- Connector 1:1 -->
  <line x1="258" y1="89" x2="368" y2="89" stroke="#1e293b" stroke-width="2.2"/>
  <line x1="270" y1="80" x2="270" y2="98" stroke="#1e293b" stroke-width="2.2"/>
  <line x1="277" y1="80" x2="277" y2="98" stroke="#1e293b" stroke-width="2.2"/>
  <line x1="349" y1="80" x2="349" y2="98" stroke="#1e293b" stroke-width="2.2"/>
  <line x1="356" y1="80" x2="356" y2="98" stroke="#1e293b" stroke-width="2.2"/>

  <rect x="368" y="68" width="120" height="42" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="428" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">Паспорт</text>

  <text x="510" y="84" font-size="12.5" font-weight="700" fill="#0f172a">Один-до-одного (||--||)</text>
  <text x="510" y="103" font-size="12" fill="#475569">Рівно один запис з обох боків</text>

  <!-- Row 2: 1:M -->
  <rect x="24" y="142" width="732" height="82" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="38" y="158" width="66" height="50" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="71" y="189" text-anchor="middle" font-size="16" font-weight="700" fill="#78350f">1 : M</text>

  <rect x="130" y="162" width="128" height="42" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="194" y="188" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Аудиторія</text>

  <!-- Connector 1:M -->
  <line x1="258" y1="183" x2="368" y2="183" stroke="#1e293b" stroke-width="2.2"/>
  <line x1="270" y1="174" x2="270" y2="192" stroke="#1e293b" stroke-width="2.2"/>
  <line x1="277" y1="174" x2="277" y2="192" stroke="#1e293b" stroke-width="2.2"/>
  <circle cx="344" cy="183" r="5" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
  <line x1="352" y1="183" x2="368" y2="174" stroke="#1e293b" stroke-width="2.2"/>
  <line x1="352" y1="183" x2="368" y2="192" stroke="#1e293b" stroke-width="2.2"/>

  <rect x="368" y="162" width="120" height="42" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="428" y="188" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">Комп'ютер</text>

  <text x="510" y="178" font-size="12.5" font-weight="700" fill="#0f172a">Один-до-багатьох (||--o{)</text>
  <text x="510" y="197" font-size="12" fill="#475569">0 або більше дочірніх записів</text>

  <!-- Row 3: M:N decomposed -->
  <rect x="24" y="236" width="732" height="86" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="38" y="254" width="66" height="50" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="71" y="285" text-anchor="middle" font-size="16" font-weight="700" fill="#7f1d1d">M : N</text>

  <rect x="130" y="258" width="96" height="42" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="178" y="284" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">Студент</text>

  <!-- Connector 1:M left -->
  <line x1="226" y1="279" x2="288" y2="279" stroke="#1e293b" stroke-width="2.2"/>
  <line x1="236" y1="271" x2="236" y2="287" stroke="#1e293b" stroke-width="2"/>
  <circle cx="268" cy="279" r="4.5" fill="#ffffff" stroke="#1e293b" stroke-width="1.8"/>
  <line x1="275" y1="279" x2="288" y2="271" stroke="#1e293b" stroke-width="2"/>
  <line x1="275" y1="279" x2="288" y2="287" stroke="#1e293b" stroke-width="2"/>

  <rect x="288" y="255" width="128" height="48" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="352" y="276" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">Журнал / Оцінки</text>
  <text x="352" y="293" text-anchor="middle" font-size="10.5" fill="#991b1b">(асоціативна, FK+FK)</text>

  <!-- Connector M:1 right -->
  <line x1="416" y1="279" x2="478" y2="279" stroke="#1e293b" stroke-width="2.2"/>
  <line x1="429" y1="279" x2="416" y2="271" stroke="#1e293b" stroke-width="2"/>
  <line x1="429" y1="279" x2="416" y2="287" stroke="#1e293b" stroke-width="2"/>
  <circle cx="436" cy="279" r="4.5" fill="#ffffff" stroke="#1e293b" stroke-width="1.8"/>
  <line x1="468" y1="271" x2="468" y2="287" stroke="#1e293b" stroke-width="2"/>

  <rect x="478" y="258" width="106" height="42" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="531" y="284" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14532d">Дисципліна</text>

  <text x="602" y="274" font-size="12" font-weight="700" fill="#0f172a">Декомпозиція M:N</text>
  <text x="602" y="293" font-size="11.5" fill="#475569">Розбивається на два 1:M</text>
</svg>
