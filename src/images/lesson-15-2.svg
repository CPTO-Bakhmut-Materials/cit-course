<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 515" font-family="system-ui, -apple-system, sans-serif">
  <rect width="820" height="515" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="410" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Нормалізована ER-діаграма обліку обладнання лабораторії (3NF)</text>

  <!-- Entity 1: EMPLOYEE (top-left) -->
  <rect x="30" y="52" width="195" height="106" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="30" y="52" width="195" height="30" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="30" y="74" width="195" height="8" fill="#dbeafe"/>
  <line x1="30" y1="82" x2="225" y2="82" stroke="#2563eb" stroke-width="1.5"/>
  <text x="127" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">EMPLOYEE</text>
  <text x="42" y="102" font-size="11.5" font-weight="700" fill="#1e3a8a">PK  employee_id : int</text>
  <text x="42" y="122" font-size="11.5" fill="#334155">     full_name : string</text>
  <text x="42" y="142" font-size="11.5" fill="#334155">     phone : string</text>

  <!-- Entity 2: ROOM (top-center) -->
  <rect x="310" y="52" width="195" height="106" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="310" y="52" width="195" height="30" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="310" y="74" width="195" height="8" fill="#dbeafe"/>
  <line x1="310" y1="82" x2="505" y2="82" stroke="#2563eb" stroke-width="1.5"/>
  <text x="407" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">ROOM</text>
  <text x="322" y="102" font-size="11.5" font-weight="700" fill="#1e3a8a">PK  room_id : int</text>
  <text x="322" y="122" font-size="11.5" fill="#334155">     room_number : string</text>
  <text x="322" y="142" font-size="11.5" font-weight="600" fill="#b45309">FK  manager_id : int</text>

  <!-- Entity 3: PROCESSOR (top-right) -->
  <rect x="590" y="52" width="195" height="106" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <rect x="590" y="52" width="195" height="30" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <rect x="590" y="74" width="195" height="8" fill="#fef3c7"/>
  <line x1="590" y1="82" x2="785" y2="82" stroke="#d97706" stroke-width="1.5"/>
  <text x="687" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">PROCESSOR</text>
  <text x="602" y="102" font-size="11.5" font-weight="700" fill="#78350f">PK  cpu_id : int</text>
  <text x="602" y="122" font-size="11.5" fill="#334155">     model_name : string</text>
  <text x="602" y="142" font-size="11.5" fill="#334155">     price : decimal</text>

  <!-- Entity 4: COMPUTER (middle-center) -->
  <rect x="310" y="226" width="195" height="126" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="310" y="226" width="195" height="30" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <rect x="310" y="248" width="195" height="8" fill="#dcfce7"/>
  <line x1="310" y1="256" x2="505" y2="256" stroke="#16a34a" stroke-width="1.5"/>
  <text x="407" y="246" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">COMPUTER</text>
  <text x="322" y="276" font-size="11.5" font-weight="700" fill="#14532d">PK  pc_id : int</text>
  <text x="322" y="296" font-size="11.5" fill="#334155">     inv_number : string</text>
  <text x="322" y="316" font-size="11.5" font-weight="600" fill="#b45309">FK  room_id : int</text>
  <text x="322" y="336" font-size="11.5" font-weight="600" fill="#b45309">FK  cpu_id : int</text>

  <!-- Entity 5: COMPUTER_SOFTWARE (middle-right) -->
  <rect x="590" y="234" width="200" height="106" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <rect x="590" y="234" width="200" height="30" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <rect x="590" y="256" width="200" height="8" fill="#fee2e2"/>
  <line x1="590" y1="264" x2="790" y2="264" stroke="#dc2626" stroke-width="1.5"/>
  <text x="690" y="254" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7f1d1d">COMPUTER_SOFTWARE</text>
  <text x="602" y="284" font-size="11" font-weight="700" fill="#7f1d1d">PK,FK  pc_id : int</text>
  <text x="602" y="304" font-size="11" font-weight="700" fill="#7f1d1d">PK,FK  software_id : int</text>
  <text x="602" y="324" font-size="11" fill="#334155">          install_date : date</text>

  <!-- Entity 6: SOFTWARE (bottom-right) -->
  <rect x="590" y="392" width="200" height="104" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <rect x="590" y="392" width="200" height="30" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <rect x="590" y="414" width="200" height="8" fill="#fef3c7"/>
  <line x1="590" y1="422" x2="790" y2="422" stroke="#d97706" stroke-width="1.5"/>
  <text x="690" y="412" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">SOFTWARE</text>
  <text x="602" y="442" font-size="11.5" font-weight="700" fill="#78350f">PK  software_id : int</text>
  <text x="602" y="462" font-size="11.5" fill="#334155">     software_name : string</text>
  <text x="602" y="482" font-size="11.5" fill="#334155">     license_type : string</text>

  <!-- Relation 1: EMPLOYEE to ROOM -->
  <line x1="225" y1="106" x2="310" y2="106" stroke="#1e293b" stroke-width="2"/>
  <line x1="236" y1="98" x2="236" y2="114" stroke="#1e293b" stroke-width="2"/>
  <line x1="242" y1="98" x2="242" y2="114" stroke="#1e293b" stroke-width="2"/>
  <circle cx="290" cy="106" r="4.5" fill="#ffffff" stroke="#1e293b" stroke-width="1.8"/>
  <line x1="297" y1="106" x2="310" y2="98" stroke="#1e293b" stroke-width="2"/>
  <line x1="297" y1="106" x2="310" y2="114" stroke="#1e293b" stroke-width="2"/>
  <text x="267" y="90" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155">відповідає</text>

  <!-- Relation 2: ROOM to COMPUTER -->
  <line x1="385" y1="158" x2="385" y2="226" stroke="#1e293b" stroke-width="2"/>
  <line x1="377" y1="169" x2="393" y2="169" stroke="#1e293b" stroke-width="2"/>
  <line x1="377" y1="175" x2="393" y2="175" stroke="#1e293b" stroke-width="2"/>
  <circle cx="385" cy="206" r="4.5" fill="#ffffff" stroke="#1e293b" stroke-width="1.8"/>
  <line x1="385" y1="213" x2="377" y2="226" stroke="#1e293b" stroke-width="2"/>
  <line x1="385" y1="213" x2="393" y2="226" stroke="#1e293b" stroke-width="2"/>
  <text x="373" y="196" text-anchor="end" font-size="10.5" font-weight="600" fill="#334155">розміщує</text>

  <!-- Relation 3: PROCESSOR to COMPUTER -->
  <path d="M 687 158 L 687 192 L 460 192 L 460 226" fill="none" stroke="#1e293b" stroke-width="2"/>
  <line x1="679" y1="168" x2="695" y2="168" stroke="#1e293b" stroke-width="2"/>
  <line x1="679" y1="174" x2="695" y2="174" stroke="#1e293b" stroke-width="2"/>
  <circle cx="460" cy="206" r="4.5" fill="#ffffff" stroke="#1e293b" stroke-width="1.8"/>
  <line x1="460" y1="213" x2="452" y2="226" stroke="#1e293b" stroke-width="2"/>
  <line x1="460" y1="213" x2="468" y2="226" stroke="#1e293b" stroke-width="2"/>
  <text x="572" y="185" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155">встановлений у</text>

  <!-- Relation 4: COMPUTER to COMPUTER_SOFTWARE -->
  <line x1="505" y1="288" x2="590" y2="288" stroke="#1e293b" stroke-width="2"/>
  <line x1="516" y1="280" x2="516" y2="296" stroke="#1e293b" stroke-width="2"/>
  <line x1="522" y1="280" x2="522" y2="296" stroke="#1e293b" stroke-width="2"/>
  <circle cx="570" cy="288" r="4.5" fill="#ffffff" stroke="#1e293b" stroke-width="1.8"/>
  <line x1="577" y1="288" x2="590" y2="280" stroke="#1e293b" stroke-width="2"/>
  <line x1="577" y1="288" x2="590" y2="296" stroke="#1e293b" stroke-width="2"/>
  <text x="547" y="274" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155">має ПЗ</text>

  <!-- Relation 5: SOFTWARE to COMPUTER_SOFTWARE -->
  <line x1="690" y1="392" x2="690" y2="340" stroke="#1e293b" stroke-width="2"/>
  <line x1="682" y1="381" x2="698" y2="381" stroke="#1e293b" stroke-width="2"/>
  <line x1="682" y1="375" x2="698" y2="375" stroke="#1e293b" stroke-width="2"/>
  <circle cx="690" cy="358" r="4.5" fill="#ffffff" stroke="#1e293b" stroke-width="1.8"/>
  <line x1="690" y1="351" x2="682" y2="340" stroke="#1e293b" stroke-width="2"/>
  <line x1="690" y1="351" x2="698" y2="340" stroke="#1e293b" stroke-width="2"/>
  <text x="702" y="370" font-size="10.5" font-weight="600" fill="#334155">встановлено на</text>

  <!-- Legend Box -->
  <rect x="30" y="242" width="235" height="175" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="46" y="268" font-size="13" font-weight="700" fill="#0f172a">Умовні позначення 3NF:</text>
  <text x="46" y="294" font-size="12" font-weight="700" fill="#1e3a8a">PK</text>
  <text x="74" y="294" font-size="11.5" fill="#334155">— первинний ключ (Primary Key)</text>
  <text x="46" y="318" font-size="12" font-weight="700" fill="#b45309">FK</text>
  <text x="74" y="318" font-size="11.5" fill="#334155">— зовнішній ключ (Foreign Key)</text>
  <text x="46" y="344" font-size="12" font-weight="700" fill="#0f172a">||</text>
  <text x="74" y="344" font-size="11.5" fill="#334155">— сторона «рівно один» (1)</text>
  <text x="46" y="368" font-size="12" font-weight="700" fill="#0f172a">o{</text>
  <text x="74" y="368" font-size="11.5" fill="#334155">— «нуль або багато» (M)</text>
  <text x="46" y="396" font-size="11" fill="#7f1d1d">Асоціативна таблиця усуває M:N</text>
</svg>
