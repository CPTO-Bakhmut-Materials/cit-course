<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 370" width="100%" height="auto" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="820" height="370" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="410" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Структура повної специфікації інформаційної системи</text>

  <!-- Row 1 -->
  <rect x="28" y="54" width="236" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="146" y="83" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">1. Системний блок</text>
  <line x1="264" y1="78" x2="298" y2="78" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="304" y="54" width="488" height="48" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="322" y="83" font-size="12.5" fill="#1e293b">CPU, Motherboard, RAM, SSD/HDD, GPU, PSU, Cooler, Case</text>

  <!-- Row 2 -->
  <rect x="28" y="114" width="236" height="48" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="146" y="143" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14532d">2. Периферійне обладнання</text>
  <line x1="264" y1="138" x2="298" y2="138" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="304" y="114" width="488" height="48" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="322" y="143" font-size="12.5" fill="#1e293b">Монітори, клавіатура, миша, гарнітура, БФП</text>

  <!-- Row 3 -->
  <rect x="28" y="174" width="236" height="48" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="146" y="203" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">3. Захист живлення</text>
  <line x1="264" y1="198" x2="298" y2="198" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="304" y="174" width="488" height="48" rx="8" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="322" y="203" font-size="12.5" fill="#1e293b">Мережевий фільтр, джерело безперебійного живлення (UPS)</text>

  <!-- Row 4 -->
  <rect x="28" y="234" width="236" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="146" y="263" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">4. Програмне забезпечення</text>
  <line x1="264" y1="258" x2="298" y2="258" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="304" y="234" width="488" height="48" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="322" y="263" font-size="12.5" fill="#1e293b">Операційна система, офісний пакет, антивірус, ПЗ за профілем</text>

  <!-- Row 5 -->
  <rect x="28" y="294" width="236" height="48" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="146" y="323" text-anchor="middle" font-size="13.5" font-weight="700" fill="#991b1b">5. Сервісні послуги</text>
  <line x1="264" y1="318" x2="298" y2="318" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="304" y="294" width="488" height="48" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="322" y="323" font-size="12.5" fill="#1e293b">Збирання, стрес-тестування, встановлення ОС, гарантійний супровід</text>
</svg>
