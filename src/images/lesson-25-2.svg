<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" width="100%" height="auto" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="820" height="340" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="410" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Моделі ліцензування програмного забезпечення</text>

  <!-- Root -->
  <rect x="240" y="46" width="340" height="34" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.8"/>
  <text x="410" y="68" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Ліцензійна угода (EULA / Open Source)</text>

  <!-- Connectors -->
  <path d="M 410 80 L 410 94 L 148 94 L 148 108" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="410" y1="80" x2="410" y2="108" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 410 94 L 672 94 L 672 108" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Col 1: Proprietary -->
  <rect x="26" y="112" width="244" height="206" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.8"/>
  <rect x="26" y="112" width="244" height="44" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <rect x="26" y="142" width="244" height="14" fill="#fee2e2"/>
  <line x1="26" y1="156" x2="270" y2="156" stroke="#dc2626" stroke-width="1.5"/>
  <text x="148" y="139" text-anchor="middle" font-size="13.5" font-weight="700" fill="#991b1b">1. Пропрієтарне комерційне</text>

  <circle cx="44" cy="180" r="3.5" fill="#dc2626"/>
  <text x="56" y="184" font-size="12.5" font-weight="600" fill="#1e293b">OEM</text>
  <text x="90" y="184" font-size="12" fill="#475569">— прив'язка до плати ПК</text>

  <circle cx="44" cy="212" r="3.5" fill="#dc2626"/>
  <text x="56" y="216" font-size="12.5" font-weight="600" fill="#1e293b">Box / Retail</text>
  <text x="132" y="216" font-size="12" fill="#475569">— перенесення на ПК</text>

  <circle cx="44" cy="244" r="3.5" fill="#dc2626"/>
  <text x="56" y="248" font-size="12.5" font-weight="600" fill="#1e293b">Volume / CAL</text>
  <text x="144" y="248" font-size="12" fill="#475569">— на організацію</text>

  <circle cx="44" cy="276" r="3.5" fill="#dc2626"/>
  <text x="56" y="280" font-size="12.5" font-weight="600" fill="#1e293b">Хмарна SaaS</text>
  <text x="56" y="296" font-size="11.5" fill="#475569">(щомісячна / річна підписка)</text>

  <!-- Col 2: FOSS -->
  <rect x="288" y="112" width="244" height="206" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
  <rect x="288" y="112" width="244" height="44" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <rect x="288" y="142" width="244" height="14" fill="#dcfce7"/>
  <line x1="288" y1="156" x2="532" y2="156" stroke="#16a34a" stroke-width="1.5"/>
  <text x="410" y="139" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14532d">2. Вільне та відкрите (FOSS)</text>

  <circle cx="306" cy="180" r="3.5" fill="#16a34a"/>
  <text x="318" y="184" font-size="12.5" font-weight="600" fill="#1e293b">Копілефт (GNU GPLv3):</text>
  <text x="318" y="201" font-size="12" fill="#475569">вихідний код завжди</text>
  <text x="318" y="217" font-size="12" fill="#475569">залишається відкритим</text>

  <line x1="306" y1="234" x2="514" y2="234" stroke="#bbf7d0" stroke-width="1.5"/>

  <circle cx="306" cy="254" r="3.5" fill="#16a34a"/>
  <text x="318" y="258" font-size="12.5" font-weight="600" fill="#1e293b">Пермісивні (MIT, Apache, BSD):</text>
  <text x="318" y="275" font-size="12" fill="#475569">дозвіл на вільне використання</text>
  <text x="318" y="291" font-size="12" fill="#475569">навіть у закритих продуктах</text>

  <!-- Col 3: Trial / Freemium -->
  <rect x="550" y="112" width="244" height="206" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.8"/>
  <rect x="550" y="112" width="244" height="44" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <rect x="550" y="142" width="244" height="14" fill="#fef3c7"/>
  <line x1="550" y1="156" x2="794" y2="156" stroke="#d97706" stroke-width="1.5"/>
  <text x="672" y="139" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">3. Умовно-безкоштовне</text>

  <circle cx="568" cy="180" r="3.5" fill="#d97706"/>
  <text x="580" y="184" font-size="12.5" font-weight="600" fill="#1e293b">Shareware</text>
  <text x="580" y="201" font-size="12" fill="#475569">обмежений демо-період</text>

  <circle cx="568" cy="228" r="3.5" fill="#d97706"/>
  <text x="580" y="232" font-size="12.5" font-weight="600" fill="#1e293b">Freemium</text>
  <text x="580" y="249" font-size="12" fill="#475569">базові функції безкоштовні</text>

  <circle cx="568" cy="276" r="3.5" fill="#d97706"/>
  <text x="580" y="280" font-size="12.5" font-weight="600" fill="#1e293b">Freeware</text>
  <text x="580" y="297" font-size="12" fill="#475569">безкоштовне, але код закритий</text>
</svg>
