<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="auto" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow-right" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title -->
  <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Конструктивні форм-фактори серверів</text>

  <!-- Card 1: Tower -->
  <rect x="24" y="54" width="236" height="304" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="142" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">1. Підлогові (Tower)</text>

  <!-- Tower Illustration -->
  <rect x="97" y="96" width="90" height="122" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
  <rect x="108" y="108" width="68" height="14" rx="2" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="108" y="128" width="68" height="14" rx="2" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.2"/>
  <circle cx="166" cy="155" r="4" fill="#16a34a"/>
  <line x1="112" y1="176" x2="172" y2="176" stroke="#60a5fa" stroke-width="2"/>
  <line x1="112" y1="184" x2="172" y2="184" stroke="#60a5fa" stroke-width="2"/>
  <line x1="112" y1="192" x2="172" y2="192" stroke="#60a5fa" stroke-width="2"/>
  <line x1="112" y1="200" x2="172" y2="200" stroke="#60a5fa" stroke-width="2"/>

  <text x="40" y="246" font-size="12.5" font-weight="600" fill="#1e3a8a">• Вертикальний корпус («башта»)</text>
  <text x="40" y="268" font-size="12.5" fill="#172554">• Не потребує серверної стійки</text>
  <text x="40" y="290" font-size="12.5" fill="#172554">• Порівняно низький шум</text>
  <text x="40" y="312" font-size="12.5" fill="#172554">• Для малих офісів і філій</text>
  <text x="40" y="334" font-size="12" font-weight="600" fill="#1d4ed8">Приклад: локальний файловий ПК</text>

  <!-- Card 2: Rack-Mount -->
  <rect x="282" y="54" width="236" height="304" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="400" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">2. Стійкові (Rack-Mount)</text>

  <!-- Rack Illustration -->
  <rect x="312" y="96" width="176" height="122" rx="5" fill="#f0fdf4" stroke="#15803d" stroke-width="1.8"/>
  <!-- 1U unit -->
  <rect x="322" y="106" width="156" height="24" rx="3" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.4"/>
  <rect x="330" y="112" width="22" height="12" rx="1.5" fill="#166534"/>
  <rect x="357" y="112" width="22" height="12" rx="1.5" fill="#166534"/>
  <rect x="384" y="112" width="22" height="12" rx="1.5" fill="#166534"/>
  <text x="458" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="#14532d">1U</text>
  <!-- 2U unit -->
  <rect x="322" y="138" width="156" height="44" rx="3" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.4"/>
  <rect x="330" y="145" width="20" height="13" rx="1.5" fill="#166534"/>
  <rect x="355" y="145" width="20" height="13" rx="1.5" fill="#166534"/>
  <rect x="380" y="145" width="20" height="13" rx="1.5" fill="#166534"/>
  <rect x="405" y="145" width="20" height="13" rx="1.5" fill="#166534"/>
  <rect x="330" y="162" width="20" height="13" rx="1.5" fill="#166534"/>
  <rect x="355" y="162" width="20" height="13" rx="1.5" fill="#166534"/>
  <rect x="380" y="162" width="20" height="13" rx="1.5" fill="#166534"/>
  <rect x="405" y="162" width="20" height="13" rx="1.5" fill="#166534"/>
  <text x="458" y="164" text-anchor="middle" font-size="11" font-weight="700" fill="#14532d">2U</text>
  <!-- rails label -->
  <text x="400" y="204" text-anchor="middle" font-size="11.5" font-weight="600" fill="#166534">Стандарт 19" (482,6 мм)</text>

  <text x="298" y="246" font-size="12.5" font-weight="600" fill="#14532d">• Монтаж у 19" шафи та стійки</text>
  <text x="298" y="268" font-size="12.5" fill="#052e16">• Висота в юнітах: 1U, 2U, 4U</text>
  <text x="298" y="290" font-size="12.5" fill="#052e16">• 1U = 1,75" (≈ 44,45 мм)</text>
  <text x="298" y="312" font-size="12.5" fill="#052e16">• Стандарт серверних і ЦОД</text>
  <text x="298" y="334" font-size="12" font-weight="600" fill="#15803d">2U — універсальний «золотий»</text>

  <!-- Card 3: Blade -->
  <rect x="540" y="54" width="236" height="304" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="658" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#78350f">3. Лезові (Blade)</text>

  <!-- Blade Illustration -->
  <rect x="578" y="96" width="160" height="122" rx="5" fill="#fffbeb" stroke="#b45309" stroke-width="1.8"/>
  <!-- Vertical blade modules -->
  <rect x="588" y="105" width="18" height="78" rx="2" fill="#fde68a" stroke="#d97706" stroke-width="1.3"/>
  <rect x="610" y="105" width="18" height="78" rx="2" fill="#fde68a" stroke="#d97706" stroke-width="1.3"/>
  <rect x="632" y="105" width="18" height="78" rx="2" fill="#fde68a" stroke="#d97706" stroke-width="1.3"/>
  <rect x="654" y="105" width="18" height="78" rx="2" fill="#fde68a" stroke="#d97706" stroke-width="1.3"/>
  <rect x="676" y="105" width="18" height="78" rx="2" fill="#fde68a" stroke="#d97706" stroke-width="1.3"/>
  <rect x="698" y="105" width="28" height="78" rx="2" fill="#fed7aa" stroke="#ea580c" stroke-width="1.3"/>
  <!-- Shared PSU / Midplane bar -->
  <rect x="588" y="189" width="138" height="20" rx="2" fill="#f59e0b" fill-opacity="0.35" stroke="#b45309" stroke-width="1.2"/>
  <text x="657" y="203" text-anchor="middle" font-size="10.5" font-weight="700" fill="#78350f">Спільні БЖ та мережа</text>

  <text x="556" y="246" font-size="12.5" font-weight="600" fill="#78350f">• Компактні плати-«леза»</text>
  <text x="556" y="268" font-size="12.5" fill="#451a03">• Спільні БЖ, кулери, комутатор</text>
  <text x="556" y="290" font-size="12.5" fill="#451a03">• Мінімум кабелів підключення</text>
  <text x="556" y="312" font-size="12.5" fill="#451a03">• Максимальна щільність ядер</text>
  <text x="556" y="334" font-size="12" font-weight="600" fill="#b45309">Централізоване керування шасі</text>

  <!-- Bottom Scale Arrow -->
  <line x1="60" y1="386" x2="730" y2="386" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-right)"/>
  <rect x="215" y="373" width="370" height="26" rx="13" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="400" y="390" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e40af">Зростання щільності обчислень та централізації</text>
</svg>
