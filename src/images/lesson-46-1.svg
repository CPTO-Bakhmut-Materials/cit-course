<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="100%" height="auto" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="840" height="330" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Рівні відновлення операційної системи Linux при збоях</text>

  <!-- Level 1: Normal -->
  <rect x="24" y="60" width="178" height="170" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <rect x="24" y="60" width="178" height="36" rx="10" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.8"/>
  <text x="113" y="83" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14532d">1. Штатний режим</text>
  <text x="113" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#052e16">multi-user.target</text>
  <text x="113" y="142" text-anchor="middle" font-size="11" fill="#166534">Усі служби та мережа</text>
  <text x="113" y="159" text-anchor="middle" font-size="11" fill="#166534">працюють у нормі</text>
  <text x="113" y="190" text-anchor="middle" font-size="10.5" font-weight="600" fill="#15803d">Діагностика окремої</text>
  <text x="113" y="206" text-anchor="middle" font-size="10.5" font-weight="600" fill="#15803d">служби: journalctl -u</text>

  <line x1="202" y1="145" x2="226" y2="145" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow-dark)"/>

  <!-- Level 2: Rescue -->
  <rect x="230" y="60" width="178" height="170" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <rect x="230" y="60" width="178" height="36" rx="10" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="319" y="83" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">2. Режим порятунку</text>
  <text x="319" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#172554">rescue.target</text>
  <text x="319" y="142" text-anchor="middle" font-size="11" fill="#1e40af">Локальні диски змонтовані,</text>
  <text x="319" y="159" text-anchor="middle" font-size="11" fill="#1e40af">мережа вимкнена</text>
  <text x="319" y="190" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1d4ed8">Скидання конфігурацій,</text>
  <text x="319" y="206" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1d4ed8">пароль root обов'язковий</text>

  <line x1="408" y1="145" x2="432" y2="145" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow-dark)"/>

  <!-- Level 3: Emergency -->
  <rect x="436" y="60" width="178" height="170" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <rect x="436" y="60" width="178" height="36" rx="10" fill="#fde68a" stroke="#d97706" stroke-width="1.8"/>
  <text x="525" y="83" text-anchor="middle" font-size="12.5" font-weight="700" fill="#78350f">3. Аварійний режим</text>
  <text x="525" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#451a03">emergency.target</text>
  <text x="525" y="142" text-anchor="middle" font-size="11" fill="#92400e">Корінь (/) лише для</text>
  <text x="525" y="159" text-anchor="middle" font-size="11" fill="#92400e">читання (ro), мінімум ОС</text>
  <text x="525" y="190" text-anchor="middle" font-size="10.5" font-weight="600" fill="#b45309">Ремонт /etc/fstab та</text>
  <text x="525" y="206" text-anchor="middle" font-size="10.5" font-weight="600" fill="#b45309">суперблоків дисків</text>

  <line x1="614" y1="145" x2="638" y2="145" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow-dark)"/>

  <!-- Level 4: Live USB + chroot -->
  <rect x="642" y="60" width="174" height="170" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <rect x="642" y="60" width="174" height="36" rx="10" fill="#fecaca" stroke="#dc2626" stroke-width="1.8"/>
  <text x="729" y="83" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7f1d1d">4. Live USB + chroot</text>
  <text x="729" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#450a0a">Зовнішній носій</text>
  <text x="729" y="142" text-anchor="middle" font-size="11" fill="#991b1b">Коли ОС не стартує</text>
  <text x="729" y="159" text-anchor="middle" font-size="11" fill="#991b1b">або пошкоджено GRUB</text>
  <text x="729" y="190" text-anchor="middle" font-size="10.5" font-weight="600" fill="#b91c1c">mount /dev/sda1 /mnt</text>
  <text x="729" y="206" text-anchor="middle" font-size="10.5" font-weight="600" fill="#b91c1c">fsck • chroot • grub-install</text>

  <!-- Bottom note -->
  <rect x="24" y="250" width="792" height="58" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="420" y="274" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Правило перевірки файлової системи (fsck / e2fsck)</text>
  <text x="420" y="294" text-anchor="middle" font-size="12" fill="#334155">Перевірку виконують лише на розмонтованому розділі або в режимі читання (ro), щоб не пошкодити метадані.</text>
</svg>
