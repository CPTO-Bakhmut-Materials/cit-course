<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 390" width="100%" height="auto" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="820" height="390" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="410" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Схема автентифікації за SSH-ключами (Ed25519)</text>

  <!-- Client Panel -->
  <rect x="32" y="56" width="314" height="150" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="189" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Клієнт (ПК оператора)</text>

  <rect x="48" y="94" width="282" height="44" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="189" y="113" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7f1d1d">~/.ssh/id_ed25519 (Приватний ключ)</text>
  <text x="189" y="130" text-anchor="middle" font-size="11.5" fill="#b91c1c">Зберігається таємно, права 600</text>

  <rect x="48" y="148" width="282" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="189" y="167" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14532d">~/.ssh/id_ed25519.pub (Публічний ключ)</text>
  <text x="189" y="184" text-anchor="middle" font-size="11.5" fill="#15803d">Передається на сервер одноразово</text>

  <!-- Arrow ssh-copy-id -->
  <line x1="330" y1="170" x2="482" y2="170" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="364" y="142" width="92" height="22" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="410" y="157" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">ssh-copy-id</text>

  <!-- Server Panel -->
  <rect x="474" y="56" width="314" height="150" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="631" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">Сервер Linux (TCP-порт 22)</text>

  <rect x="490" y="94" width="282" height="44" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
  <text x="631" y="113" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Демон OpenSSH (служба sshd)</text>
  <text x="631" y="130" text-anchor="middle" font-size="11.5" fill="#475569">Перевіряє підпис клієнта без пароля</text>

  <rect x="490" y="148" width="282" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="631" y="167" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14532d">~/.ssh/authorized_keys</text>
  <text x="631" y="184" text-anchor="middle" font-size="11.5" fill="#15803d">Зберігає довірені публічні ключі (600)</text>

  <!-- Bottom 4-step Challenge-Response Flow -->
  <text x="410" y="236" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Процес перевірки автентичності під час підключення:</text>

  <rect x="32" y="254" width="172" height="110" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="118" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Крок 1</text>
  <text x="118" y="302" text-anchor="middle" font-size="12" fill="#0f172a">Клієнт надсилає</text>
  <text x="118" y="320" text-anchor="middle" font-size="12" fill="#0f172a">запит на з'єднання</text>
  <text x="118" y="344" text-anchor="middle" font-size="11" fill="#1e40af">ssh operator@IP</text>

  <line x1="204" y1="309" x2="220" y2="309" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="226" y="254" width="172" height="110" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="312" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">Крок 2</text>
  <text x="312" y="302" text-anchor="middle" font-size="12" fill="#0f172a">Сервер шифрує</text>
  <text x="312" y="320" text-anchor="middle" font-size="12" fill="#0f172a">випадковий «виклик»</text>
  <text x="312" y="344" text-anchor="middle" font-size="11" fill="#b45309">публічним ключем</text>

  <line x1="398" y1="309" x2="414" y2="309" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="420" y="254" width="172" height="110" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="506" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">Крок 3</text>
  <text x="506" y="302" text-anchor="middle" font-size="12" fill="#0f172a">Клієнт розшифровує</text>
  <text x="506" y="320" text-anchor="middle" font-size="12" fill="#0f172a">приватним ключем</text>
  <text x="506" y="344" text-anchor="middle" font-size="11" fill="#b91c1c">і повертає відповідь</text>

  <line x1="592" y1="309" x2="608" y2="309" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="614" y="254" width="174" height="110" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="701" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">Крок 4</text>
  <text x="701" y="302" text-anchor="middle" font-size="12" fill="#0f172a">Сервер підтверджує</text>
  <text x="701" y="320" text-anchor="middle" font-size="12" fill="#0f172a">автентичність</text>
  <text x="701" y="344" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">Вхід БЕЗ пароля!</text>
</svg>
