<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#1e293b"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="820" height="500" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="410" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Діаграма станів: життєвий цикл електронного замовлення</text>

  <!-- Initial Pseudostate -->
  <circle cx="85" cy="58" r="10" fill="#0f172a"/>
  <text x="52" y="62" text-anchor="end" font-size="11.5" font-weight="600" fill="#475569">Початок</text>
  <line x1="85" y1="68" x2="85" y2="98" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="94" y="88" font-size="11" font-weight="600" fill="#0f172a">створитиЗамовлення()</text>

  <!-- State: Створено -->
  <rect x="25" y="100" width="120" height="46" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="85" y="128" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">Створено</text>

  <!-- Transition Створено -> ОчікуєОплати -->
  <line x1="145" y1="123" x2="273" y2="123" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="209" y="114" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">обратиСпосібОплати()</text>

  <!-- State: ОчікуєОплати -->
  <rect x="275" y="100" width="140" height="46" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="345" y="128" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">ОчікуєОплати</text>

  <!-- Transition ОчікуєОплати -> Оплачено -->
  <line x1="415" y1="123" x2="563" y2="123" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="489" y="114" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">платіжПідтверджено()</text>

  <!-- State: Оплачено -->
  <rect x="565" y="100" width="120" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="625" y="128" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14532d">Оплачено</text>

  <!-- Transition Оплачено -> Комплектується -->
  <line x1="625" y1="146" x2="625" y2="203" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="634" y="179" font-size="11" font-weight="600" fill="#0f172a">призначитиСклад()</text>

  <!-- Composite State: Комплектується -->
  <rect x="290" y="205" width="505" height="145" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <line x1="290" y1="236" x2="795" y2="236" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="542" y="226" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">Комплектується (складений стан)</text>

  <!-- Inside Composite State -->
  <circle cx="312" cy="291" r="7" fill="#0f172a"/>
  <line x1="319" y1="291" x2="335" y2="291" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="337" y="270" width="96" height="42" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="385" y="295" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">ЗбірТоварів</text>

  <line x1="433" y1="291" x2="523" y2="291" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="478" y="271" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155">всіТовари</text>
  <text x="478" y="283" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155">ВНаявності</text>

  <rect x="525" y="270" width="90" height="42" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="570" y="295" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Пакування</text>

  <line x1="615" y1="291" x2="693" y2="291" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="654" y="271" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155">наклеїти</text>
  <text x="654" y="283" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155">Штрихкод</text>

  <rect x="695" y="270" width="88" height="42" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="739" y="295" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Сформовано</text>

  <!-- Transition ОчікуєОплати -> Скасовано -->
  <path d="M 310 146 L 310 182 L 110 182 L 110 266" fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <text x="210" y="175" text-anchor="middle" font-size="11" font-weight="600" fill="#b91c1c">таймаут(24год)</text>

  <!-- Transition Комплектується -> Скасовано -->
  <line x1="290" y1="292" x2="177" y2="292" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <text x="233" y="283" text-anchor="middle" font-size="10.5" font-weight="600" fill="#b91c1c">клієнтВідмовився()</text>
  <text x="233" y="308" text-anchor="middle" font-size="10.5" fill="#991b1b">/ повернутиКошти()</text>

  <!-- State: Скасовано -->
  <rect x="45" y="268" width="130" height="48" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="110" y="297" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7f1d1d">Скасовано</text>

  <!-- Скасовано -> Final State -->
  <line x1="110" y1="316" x2="110" y2="380" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <circle cx="110" cy="396" r="13" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <circle cx="110" cy="396" r="8" fill="#0f172a"/>
  <text x="110" y="425" text-anchor="middle" font-size="11.5" font-weight="600" fill="#475569">Кінцевий стан</text>

  <!-- Transition Комплектується -> Відправлено -->
  <line x1="642" y1="350" x2="642" y2="413" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="651" y="387" font-size="11" font-weight="600" fill="#0f172a">переданоКур'єру()</text>

  <!-- State: Відправлено -->
  <rect x="580" y="415" width="125" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="642" y="443" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14532d">Відправлено</text>

  <!-- Transition Відправлено -> Виконано -->
  <line x1="580" y1="438" x2="442" y2="438" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="511" y="428" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">підтвердженняДоставки()</text>

  <!-- State: Виконано -->
  <rect x="320" y="415" width="120" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="380" y="443" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14532d">Виконано</text>

  <!-- Виконано -> Final State -->
  <line x1="320" y1="438" x2="265" y2="438" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <circle cx="250" cy="438" r="13" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <circle cx="250" cy="438" r="8" fill="#0f172a"/>
  <text x="250" y="468" text-anchor="middle" font-size="11.5" font-weight="600" fill="#475569">Кінцевий стан</text>
</svg>
