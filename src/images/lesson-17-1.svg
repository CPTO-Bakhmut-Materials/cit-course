<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="100%" height="auto" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="440" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Title -->
  <text x="410" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Структура апаратного комплексу інформаційної системи</text>

  <!-- Top Row: 4 Main Data-Flow Subsystems -->
  <!-- 1. Введення -->
  <rect x="24" y="60" width="170" height="122" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="109" y="85" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">1. Введення</text>
  <line x1="40" y1="95" x2="178" y2="95" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="109" y="114" text-anchor="middle" font-size="11.5" fill="#1e293b">Сканери, ТСД,</text>
  <text x="109" y="131" text-anchor="middle" font-size="11.5" fill="#1e293b">RFID / біометрія,</text>
  <text x="109" y="148" text-anchor="middle" font-size="11.5" fill="#1e293b">датчики IoT,</text>
  <text x="109" y="165" text-anchor="middle" font-size="11.5" fill="#1e293b">клавіатури</text>

  <!-- 2. Обробка -->
  <rect x="226" y="60" width="170" height="122" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="311" y="85" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14532d">2. Обробка</text>
  <line x1="242" y1="95" x2="380" y2="95" stroke="#86efac" stroke-width="1.2"/>
  <text x="311" y="114" text-anchor="middle" font-size="11.5" fill="#1e293b">Процесори CPU,</text>
  <text x="311" y="131" text-anchor="middle" font-size="11.5" fill="#1e293b">співпроцесори GPU,</text>
  <text x="311" y="148" text-anchor="middle" font-size="11.5" fill="#1e293b">чіпсети,</text>
  <text x="311" y="165" text-anchor="middle" font-size="11.5" fill="#1e293b">шини PCIe 4.0/5.0</text>

  <!-- 3. Збереження -->
  <rect x="428" y="60" width="170" height="122" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="513" y="85" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">3. Збереження</text>
  <line x1="444" y1="95" x2="582" y2="95" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="513" y="114" text-anchor="middle" font-size="11.5" fill="#1e293b">RAM (DDR4/DDR5),</text>
  <text x="513" y="131" text-anchor="middle" font-size="11.5" fill="#1e293b">NVMe SSD, SAS HDD,</text>
  <text x="513" y="148" text-anchor="middle" font-size="11.5" fill="#1e293b">масиви RAID,</text>
  <text x="513" y="165" text-anchor="middle" font-size="11.5" fill="#1e293b">сховища SAN / NAS</text>

  <!-- 4. Виведення -->
  <rect x="630" y="60" width="166" height="122" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="713" y="85" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">4. Виведення</text>
  <line x1="646" y1="95" x2="780" y2="95" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="713" y="114" text-anchor="middle" font-size="11.5" fill="#1e293b">Професійні</text>
  <text x="713" y="131" text-anchor="middle" font-size="11.5" fill="#1e293b">монітори, БФП,</text>
  <text x="713" y="148" text-anchor="middle" font-size="11.5" fill="#1e293b">принтери чеків,</text>
  <text x="713" y="165" text-anchor="middle" font-size="11.5" fill="#1e293b">цифрові табло</text>

  <!-- Horizontal arrows between 1, 2, 3, 4 -->
  <line x1="194" y1="121" x2="222" y2="121" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="400" y1="121" x2="424" y2="121" stroke="#475569" stroke-width="2.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="598" y1="121" x2="626" y2="121" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- Bus line connecting top 4 subsystems down to subsystem 5 -->
  <line x1="109" y1="186" x2="109" y2="218" stroke="#2563eb" stroke-width="2" marker-start="url(#arrow-blue)"/>
  <line x1="311" y1="186" x2="311" y2="218" stroke="#2563eb" stroke-width="2" marker-start="url(#arrow-blue)"/>
  <line x1="513" y1="186" x2="513" y2="218" stroke="#2563eb" stroke-width="2" marker-start="url(#arrow-blue)"/>
  <line x1="713" y1="186" x2="713" y2="218" stroke="#2563eb" stroke-width="2" marker-start="url(#arrow-blue)"/>
  <line x1="109" y1="218" x2="713" y2="218" stroke="#2563eb" stroke-width="2.2"/>
  <line x1="410" y1="218" x2="410" y2="244" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>

  <!-- 5. Комунікаційна підсистема -->
  <rect x="110" y="248" width="600" height="72" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="410" y="274" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">5. Комунікаційна підсистема</text>
  <text x="410" y="298" text-anchor="middle" font-size="12" fill="#1e293b">Мережеві адаптери NIC (1–25 Гбіт/с), комутатори L2/L3, маршрутизатори (VPN), апаратні фаєрволи (NGFW)</text>

  <!-- Connector 5 <-> 6 -->
  <line x1="410" y1="320" x2="410" y2="346" stroke="#dc2626" stroke-width="2.2"/>

  <!-- 6. Підсистема гарантованого живлення -->
  <rect x="110" y="346" width="600" height="74" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="410" y="372" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">6. Підсистема гарантованого електроживлення та захисту</text>
  <text x="410" y="396" text-anchor="middle" font-size="12" fill="#1e293b">ДБЖ (UPS On-Line), дубльовані блоки живлення 1+1 / N+1, модулі PDU, перемикачі фаз ATS, генератори</text>
</svg>
