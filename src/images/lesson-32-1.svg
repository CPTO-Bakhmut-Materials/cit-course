<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 350" width="100%" height="auto" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="820" height="350" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="410" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Спеціальні біти дозволів у Linux: SUID, SGID та Sticky Bit</text>

  <!-- Row 1: SUID -->
  <rect x="28" y="56" width="228" height="82" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="142" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#7f1d1d">SUID (Set UID)</text>
  <text x="142" y="110" text-anchor="middle" font-size="12.5" font-weight="600" fill="#b91c1c">Префікс 4000 | символ s</text>
  <line x1="256" y1="97" x2="290" y2="97" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="296" y="56" width="496" height="82" rx="10" fill="#ffffff" stroke="#fca5a5" stroke-width="1.6"/>
  <text x="314" y="80" font-size="13" font-weight="700" fill="#0f172a">Виконуваний файл запускається з правами свого ВЛАСНИКА</text>
  <text x="314" y="102" font-size="12.5" fill="#334155">Приклад: /usr/bin/passwd запускається звичайним користувачем</text>
  <text x="314" y="122" font-size="12.5" fill="#334155">з тимчасовими правами root для оновлення пароля у /etc/shadow</text>

  <!-- Row 2: SGID -->
  <rect x="28" y="152" width="228" height="82" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="142" y="184" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">SGID (Set GID)</text>
  <text x="142" y="206" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e40af">Префікс 2000 | символ s</text>
  <line x1="256" y1="193" x2="290" y2="193" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="296" y="152" width="496" height="82" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.6"/>
  <text x="314" y="176" font-size="13" font-weight="700" fill="#0f172a">Усі новостворені файли в каталозі успадковують групу каталогу</text>
  <text x="314" y="198" font-size="12.5" fill="#334155">Приклад: chmod 2770 /srv/shares/accounting_docs (drwxrws---)</text>
  <text x="314" y="218" font-size="12.5" fill="#334155">Забезпечує зручну спільну роботу команди без втрати доступу</text>

  <!-- Row 3: Sticky Bit -->
  <rect x="28" y="248" width="228" height="82" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="142" y="280" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">Sticky Bit</text>
  <text x="142" y="302" text-anchor="middle" font-size="12.5" font-weight="600" fill="#15803d">Префікс 1000 | символ t</text>
  <line x1="256" y1="289" x2="290" y2="289" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="296" y="248" width="496" height="82" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.6"/>
  <text x="314" y="272" font-size="13" font-weight="700" fill="#0f172a">Видаляти або перейменовувати файл може ТІЛЬКИ автор чи root</text>
  <text x="314" y="294" font-size="12.5" fill="#334155">Приклад: chmod 1777 /srv/shares/public_drop (drwxrwxrwt) і /tmp</text>
  <text x="314" y="314" font-size="12.5" fill="#334155">Захищає чужі файли у спільних папках навіть при повному записі</text>
</svg>
