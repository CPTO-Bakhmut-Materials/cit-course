<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 295" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow-left-10" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 10 1 L 2 5 L 10 9 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="740" height="295" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="370" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Нотація об'єкта в UML (двосекційний блок)</text>

  <!-- Main UML Object Box -->
  <!-- Section 1: Object Name -->
  <rect x="34" y="54" width="348" height="48" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="208" y="83" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">pc01 : Computer</text>
  <line x1="138" y1="88" x2="278" y2="88" stroke="#1e3a8a" stroke-width="1.8"/>

  <!-- Section 2: Attribute Values -->
  <rect x="34" y="102" width="348" height="160" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="50" y="132" font-size="13.5" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">inventoryNumber = "INV-04113-01"</text>
  <text x="50" y="164" font-size="13.5" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ipAddress = "192.168.1.101"</text>
  <text x="50" y="196" font-size="13.5" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ramGb = 16</text>
  <text x="50" y="228" font-size="13.5" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">osName = "Ubuntu 24.04 LTS"</text>

  <!-- Clean outer border -->
  <rect x="34" y="54" width="348" height="208" rx="4" fill="none" stroke="#334155" stroke-width="2"/>
  <line x1="34" y1="102" x2="382" y2="102" stroke="#334155" stroke-width="1.8"/>

  <!-- Arrows -->
  <line x1="436" y1="78" x2="390" y2="78" stroke="#475569" stroke-width="2" marker-end="url(#arrow-left-10)"/>
  <line x1="436" y1="166" x2="390" y2="166" stroke="#475569" stroke-width="2" marker-end="url(#arrow-left-10)"/>

  <!-- Annotation Cards -->
  <rect x="438" y="52" width="272" height="58" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="452" y="76" font-size="13.5" font-weight="700" fill="#1e3a8a">1. Ім'я екземпляра та клас</text>
  <text x="452" y="97" font-size="12.5" fill="#1e40af">Обов'язково підкреслюються!</text>

  <rect x="438" y="126" width="272" height="78" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="452" y="152" font-size="13.5" font-weight="700" fill="#14532d">2. Конкретні значення полів</text>
  <text x="452" y="174" font-size="12.5" fill="#166534">Формат: назваАтрибута = значення</text>
  <text x="452" y="193" font-size="12" fill="#166534">Фіксує стан у момент часу T</text>

  <rect x="438" y="218" width="272" height="44" rx="8" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="574" y="245" text-anchor="middle" font-size="13" font-weight="600" fill="#991b1b">Секція методів відсутня</text>
</svg>
