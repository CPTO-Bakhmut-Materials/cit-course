<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 390" width="100%" height="auto" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="820" height="390" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="410" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Порівняння архітектур гіпервізорів 1-го та 2-го типів</text>

  <!-- Left Column: Type 1 -->
  <rect x="30" y="48" width="364" height="28" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="212" y="67" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14532d">Гіпервізор 1-го типу (Bare-metal)</text>

  <!-- Type 1 VMs -->
  <rect x="30" y="86" width="175" height="78" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <rect x="30" y="86" width="175" height="28" rx="8" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="117.5" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">ВМ 1 (Linux)</text>
  <text x="117.5" y="132" text-anchor="middle" font-size="11.5" fill="#172554">Застосунки та сервіси</text>
  <text x="117.5" y="150" text-anchor="middle" font-size="11" fill="#1e40af">Гостьова ОС</text>

  <rect x="219" y="86" width="175" height="78" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <rect x="219" y="86" width="175" height="28" rx="8" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="306.5" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">ВМ 2 (Windows)</text>
  <text x="306.5" y="132" text-anchor="middle" font-size="11.5" fill="#172554">Застосунки та сервіси</text>
  <text x="306.5" y="150" text-anchor="middle" font-size="11" fill="#1e40af">Гостьова ОС</text>

  <!-- Type 1 Hypervisor -->
  <rect x="30" y="174" width="364" height="66" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="212" y="200" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Гіпервізор 1-го типу</text>
  <text x="212" y="222" text-anchor="middle" font-size="12" fill="#166534">KVM / Proxmox VE / VMware ESXi / Hyper-V</text>

  <!-- Type 1 Hardware -->
  <rect x="30" y="250" width="364" height="80" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="212" y="276" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">Апаратне забезпечення сервера</text>
  <text x="212" y="297" text-anchor="middle" font-size="11.5" fill="#451a03">Процесор (Intel VT-x / AMD-V), RAM, Диски, NIC</text>
  <text x="212" y="316" text-anchor="middle" font-size="11" font-weight="600" fill="#b45309">Прямий доступ до заліза — мінімальні витрати</text>

  <!-- Right Column: Type 2 -->
  <rect x="426" y="48" width="364" height="28" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="608" y="67" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7f1d1d">Гіпервізор 2-го типу (Hosted)</text>

  <!-- Type 2 VMs -->
  <rect x="426" y="86" width="175" height="78" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <rect x="426" y="86" width="175" height="28" rx="8" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="513.5" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">ВМ 1 (Linux)</text>
  <text x="513.5" y="132" text-anchor="middle" font-size="11.5" fill="#172554">Застосунки та сервіси</text>
  <text x="513.5" y="150" text-anchor="middle" font-size="11" fill="#1e40af">Гостьова ОС</text>

  <rect x="615" y="86" width="175" height="78" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <rect x="615" y="86" width="175" height="28" rx="8" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="702.5" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">ВМ 2 (Windows)</text>
  <text x="702.5" y="132" text-anchor="middle" font-size="11.5" fill="#172554">Застосунки та сервіси</text>
  <text x="702.5" y="150" text-anchor="middle" font-size="11" fill="#1e40af">Гостьова ОС</text>

  <!-- Type 2 Hypervisor -->
  <rect x="426" y="174" width="364" height="48" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="608" y="195" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7f1d1d">Гіпервізор 2-го типу</text>
  <text x="608" y="213" text-anchor="middle" font-size="11.5" fill="#991b1b">Oracle VirtualBox / VMware Workstation</text>

  <!-- Host OS -->
  <rect x="426" y="229" width="364" height="46" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="1.6"/>
  <text x="608" y="249" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Хостова операційна система</text>
  <text x="608" y="266" text-anchor="middle" font-size="11" fill="#334155">Windows 10/11, Ubuntu Desktop, macOS</text>

  <!-- Type 2 Hardware -->
  <rect x="426" y="282" width="364" height="48" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="608" y="303" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">Апаратне забезпечення ПК</text>
  <text x="608" y="320" text-anchor="middle" font-size="11" fill="#451a03">Процесор, RAM, Диски, Мережевий адаптер</text>

  <!-- Bottom Notes -->
  <rect x="30" y="342" width="364" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="212" y="362" text-anchor="middle" font-size="11.5" font-weight="600" fill="#14532d">Застосування: дата-центри, промислові сервери</text>

  <rect x="426" y="342" width="364" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="608" y="362" text-anchor="middle" font-size="11.5" font-weight="600" fill="#991b1b">Застосування: навчання, тестування на ПК</text>
</svg>
