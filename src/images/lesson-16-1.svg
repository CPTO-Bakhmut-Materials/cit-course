<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" font-family="system-ui, -apple-system, sans-serif">
  <rect width="780" height="320" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Main Header Banner -->
  <rect x="30" y="22" width="720" height="58" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="390" y="47" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">СЛОВНИК ДАНИХ (Data Dictionary)</text>
  <text x="390" y="68" text-anchor="middle" font-size="12.5" fill="#1e40af">Централізований технічний регламент опису метаданих інформаційної системи</text>

  <!-- Left Card -->
  <rect x="30" y="98" width="348" height="198" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="30" y="98" width="348" height="34" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <rect x="30" y="122" width="348" height="10" fill="#dcfce7"/>
  <line x1="30" y1="132" x2="378" y2="132" stroke="#16a34a" stroke-width="1.5"/>
  <text x="204" y="120" text-anchor="middle" font-size="13.5" font-weight="700" fill="#14532d">Структура та валідація поля</text>

  <circle cx="50" cy="156" r="4" fill="#16a34a"/>
  <text x="64" y="160" font-size="12.5" fill="#1e293b">Назва елемента (логічна та фізична)</text>
  <circle cx="50" cy="184" r="4" fill="#16a34a"/>
  <text x="64" y="188" font-size="12.5" fill="#1e293b">Тип даних і точна довжина</text>
  <circle cx="50" cy="212" r="4" fill="#16a34a"/>
  <text x="64" y="216" font-size="12.5" fill="#1e293b">Формат представлення (маска введення)</text>
  <circle cx="50" cy="240" r="4" fill="#16a34a"/>
  <text x="64" y="244" font-size="12.5" fill="#1e293b">Допустимі значення (домен / обмеження)</text>
  <circle cx="50" cy="268" r="4" fill="#16a34a"/>
  <text x="64" y="272" font-size="12.5" fill="#1e293b">Обов'язковість заповнення (NOT NULL)</text>

  <!-- Right Card -->
  <rect x="402" y="98" width="348" height="198" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <rect x="402" y="98" width="348" height="34" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <rect x="402" y="122" width="348" height="10" fill="#fef3c7"/>
  <line x1="402" y1="132" x2="750" y2="132" stroke="#d97706" stroke-width="1.5"/>
  <text x="576" y="120" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">Контекст, безпека та зв'язки</text>

  <circle cx="422" cy="156" r="4" fill="#d97706"/>
  <text x="436" y="160" font-size="12.5" fill="#1e293b">Джерело походження даного</text>
  <circle cx="422" cy="184" r="4" fill="#d97706"/>
  <text x="436" y="188" font-size="12.5" fill="#1e293b">Права доступу та рівень безпеки</text>
  <circle cx="422" cy="212" r="4" fill="#d97706"/>
  <text x="436" y="216" font-size="12.5" fill="#1e293b">Синоніми / псевдоніми (Aliases)</text>
  <circle cx="422" cy="240" r="4" fill="#d97706"/>
  <text x="436" y="244" font-size="12.5" fill="#1e293b">Зв'язки з іншими елементами (FK)</text>
  <circle cx="422" cy="268" r="4" fill="#d97706"/>
  <text x="436" y="272" font-size="12.5" fill="#1e293b">Текстовий змістовий коментар</text>
</svg>
