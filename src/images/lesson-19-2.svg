<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 310" width="100%" height="auto" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="820" height="310" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="410" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Порівняння форм-факторів офісних робочих станцій</text>

  <!-- 1. Micro-ATX Tower -->
  <rect x="26" y="54" width="242" height="232" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="147" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Micro-ATX Mini-Tower</text>
  <text x="147" y="96" text-anchor="middle" font-size="12" fill="#1e40af">Об'єм 25–30 л</text>
  <!-- Illustration -->
  <rect x="102" y="108" width="90" height="122" rx="6" fill="#ffffff" stroke="#1e3a8a" stroke-width="2"/>
  <rect x="114" y="118" width="66" height="14" rx="2" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>
  <text x="147" y="129" text-anchor="middle" font-size="9" font-weight="600" fill="#334155">USB / Аудіо</text>
  <rect x="114" y="142" width="66" height="52" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="147" y="165" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1e3a8a">Системна</text>
  <text x="147" y="180" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1e3a8a">плата</text>
  <rect x="114" y="200" width="66" height="22" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="147" y="215" text-anchor="middle" font-size="10" font-weight="700" fill="#78350f">Блок живлення</text>
  <text x="147" y="252" text-anchor="middle" font-size="11.5" fill="#1e293b">Легкий апгрейд, низька ціна,</text>
  <text x="147" y="269" text-anchor="middle" font-size="11.5" fill="#1e293b">відмінна вентиляція</text>

  <!-- 2. All-in-One (Моноблок) -->
  <rect x="289" y="54" width="242" height="232" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="410" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Моноблок (All-in-One)</text>
  <text x="410" y="96" text-anchor="middle" font-size="12" fill="#15803d">Монітор + ПК в одному корпусі</text>
  <!-- Illustration -->
  <rect x="330" y="110" width="160" height="96" rx="6" fill="#1e293b" stroke="#14532d" stroke-width="2"/>
  <rect x="338" y="118" width="144" height="80" rx="3" fill="#ffffff"/>
  <text x="410" y="155" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">Екран IPS + Плата</text>
  <text x="410" y="173" text-anchor="middle" font-size="10.5" fill="#475569">(вебкамера, динаміки)</text>
  <rect x="401" y="206" width="18" height="18" fill="#64748b"/>
  <rect x="372" y="224" width="76" height="6" rx="3" fill="#475569"/>
  <text x="410" y="252" text-anchor="middle" font-size="11.5" fill="#1e293b">Мінімум дротів на столі,</text>
  <text x="410" y="269" text-anchor="middle" font-size="11.5" fill="#1e293b">ідеально для фронт-офісу</text>

  <!-- 3. Mini-PC (1L) -->
  <rect x="552" y="54" width="242" height="232" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="673" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">Міні-ПК (Mini-PC / 1L)</text>
  <text x="673" y="96" text-anchor="middle" font-size="12" fill="#b45309">Об'єм 1–2 л (розмір книги)</text>
  <!-- Illustration -->
  <rect x="598" y="118" width="102" height="72" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="649" y="152" text-anchor="middle" font-size="10.5" fill="#475569">Задня стінка</text>
  <text x="649" y="166" text-anchor="middle" font-size="10.5" fill="#475569">монітора</text>
  <rect x="688" y="132" width="54" height="44" rx="5" fill="#ffffff" stroke="#d97706" stroke-width="2.2"/>
  <circle cx="702" cy="147" r="3" fill="#16a34a"/>
  <circle cx="714" cy="147" r="3" fill="#64748b"/>
  <rect x="698" y="158" width="32" height="8" rx="2" fill="#94a3b8"/>
  <text x="673" y="212" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">Кріплення VESA ззаду монітора</text>
  <text x="673" y="252" text-anchor="middle" font-size="11.5" fill="#1e293b">Повна тиша, низьке споживання,</text>
  <text x="673" y="269" text-anchor="middle" font-size="11.5" fill="#1e293b">економія простору (Open Space)</text>
</svg>
