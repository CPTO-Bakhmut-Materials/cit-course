<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="100%" height="auto" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="820" height="330" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="410" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Рівні сертифікації 80 PLUS (ККД при 50% навантаженні)</text>

  <!-- Chart background & grid -->
  <rect x="210" y="54" width="520" height="236" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  <line x1="340" y1="54" x2="340" y2="290" stroke="#e2e8f0" stroke-dasharray="4,4"/>
  <line x1="470" y1="54" x2="470" y2="290" stroke="#e2e8f0" stroke-dasharray="4,4"/>
  <line x1="600" y1="54" x2="600" y2="290" stroke="#e2e8f0" stroke-dasharray="4,4"/>

  <!-- Scale labels -->
  <text x="210" y="308" text-anchor="middle" font-size="11.5" fill="#64748b">70%</text>
  <text x="340" y="308" text-anchor="middle" font-size="11.5" fill="#64748b">80%</text>
  <text x="470" y="308" text-anchor="middle" font-size="11.5" fill="#64748b">88%</text>
  <text x="600" y="308" text-anchor="middle" font-size="11.5" fill="#64748b">94%</text>
  <text x="730" y="308" text-anchor="middle" font-size="11.5" fill="#64748b">100%</text>

  <!-- Bar 1: Standard ~80% -->
  <text x="196" y="81" text-anchor="end" font-size="13" font-weight="700" fill="#334155">80 PLUS Standard</text>
  <rect x="210" y="62" width="173" height="28" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="394" y="81" font-size="13" font-weight="700" fill="#991b1b">~80%</text>

  <!-- Bar 2: Bronze ~85% -->
  <text x="196" y="120" text-anchor="end" font-size="13" font-weight="700" fill="#334155">80 PLUS Bronze</text>
  <rect x="210" y="101" width="260" height="28" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="481" y="120" font-size="13" font-weight="700" fill="#92400e">~85%</text>

  <!-- Bar 3: Silver ~88% -->
  <text x="196" y="159" text-anchor="end" font-size="13" font-weight="700" fill="#334155">80 PLUS Silver</text>
  <rect x="210" y="140" width="312" height="28" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.6"/>
  <text x="533" y="159" font-size="13" font-weight="700" fill="#334155">~88%</text>

  <!-- Bar 4: Gold ~90% -->
  <text x="196" y="198" text-anchor="end" font-size="13" font-weight="700" fill="#334155">80 PLUS Gold</text>
  <rect x="210" y="179" width="347" height="28" rx="6" fill="#fef08a" stroke="#ca8a04" stroke-width="1.6"/>
  <text x="568" y="198" font-size="13" font-weight="700" fill="#713f12">~90%</text>

  <!-- Bar 5: Platinum ~92% -->
  <text x="196" y="237" text-anchor="end" font-size="13" font-weight="700" fill="#334155">80 PLUS Platinum</text>
  <rect x="210" y="218" width="381" height="28" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="602" y="237" font-size="13" font-weight="700" fill="#1e3a8a">~92%</text>

  <!-- Bar 6: Titanium ~94% -->
  <text x="196" y="276" text-anchor="end" font-size="13" font-weight="700" fill="#334155">80 PLUS Titanium</text>
  <rect x="210" y="257" width="416" height="28" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="637" y="276" font-size="13" font-weight="700" fill="#14532d">~94%</text>

  <!-- Right trend arrow -->
  <line x1="762" y1="70" x2="762" y2="275" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="776" y="175" font-size="12" font-weight="600" fill="#15803d" transform="rotate(90 776 175)" text-anchor="middle">Вищий ККД / менше втрат тепла</text>
</svg>
