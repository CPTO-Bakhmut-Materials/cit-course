<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 385" width="100%" height="auto" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="840" height="385" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Логічна схема сегментації мережі «ТехноСервіс» (VLAN)</text>

  <!-- Core Router / Switch -->
  <rect x="120" y="52" width="600" height="52" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="1.8"/>
  <text x="420" y="74" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Маршрутизатор (Firewall) + Керований комутатор 802.1Q</text>
  <text x="420" y="94" text-anchor="middle" font-size="12" fill="#334155">Мережа 192.168.0.0/16 поділена на 5 ізольованих підмереж /24 (маска 255.255.255.0)</text>

  <!-- Bus line -->
  <line x1="420" y1="104" x2="420" y2="122" stroke="#334155" stroke-width="2"/>
  <line x1="92" y1="122" x2="748" y2="122" stroke="#334155" stroke-width="2"/>
  <line x1="92" y1="122" x2="92" y2="142" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="256" y1="122" x2="256" y2="142" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="420" y1="122" x2="420" y2="142" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="584" y1="122" x2="584" y2="142" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="748" y1="122" x2="748" y2="142" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- VLAN 10 -->
  <rect x="20" y="148" width="144" height="212" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="1.8"/>
  <rect x="20" y="148" width="144" height="42" rx="10" fill="#cbd5e1" stroke="#475569" stroke-width="1.8"/>
  <text x="92" y="167" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">VLAN 10</text>
  <text x="92" y="183" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155">Управління</text>
  <text x="92" y="216" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">192.168.10.0/24</text>
  <text x="92" y="240" text-anchor="middle" font-size="11" fill="#334155">Шлюз:</text>
  <text x="92" y="256" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">192.168.10.1</text>
  <line x1="34" y1="274" x2="150" y2="274" stroke="#94a3b8" stroke-width="1"/>
  <text x="92" y="298" text-anchor="middle" font-size="11" fill="#334155">Маршрутизатор,</text>
  <text x="92" y="315" text-anchor="middle" font-size="11" fill="#334155">комутатор</text>
  <text x="92" y="340" text-anchor="middle" font-size="10.5" font-weight="700" fill="#475569">Тільки адмін ІТ</text>

  <!-- VLAN 20 -->
  <rect x="184" y="148" width="144" height="212" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <rect x="184" y="148" width="144" height="42" rx="10" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="256" y="167" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">VLAN 20</text>
  <text x="256" y="183" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e40af">Сервери</text>
  <text x="256" y="216" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e3a8a">192.168.20.0/24</text>
  <text x="256" y="240" text-anchor="middle" font-size="11" fill="#1e40af">Шлюз:</text>
  <text x="256" y="256" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e3a8a">192.168.20.1</text>
  <line x1="198" y1="274" x2="314" y2="274" stroke="#93c5fd" stroke-width="1"/>
  <text x="256" y="298" text-anchor="middle" font-size="11" fill="#1e40af">Сервер ІС,</text>
  <text x="256" y="315" text-anchor="middle" font-size="11" fill="#1e40af">сховище NAS</text>
  <text x="256" y="340" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1d4ed8">Порти 443, 8080, 8069</text>

  <!-- VLAN 30 -->
  <rect x="348" y="148" width="144" height="212" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <rect x="348" y="148" width="144" height="42" rx="10" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.8"/>
  <text x="420" y="167" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">VLAN 30</text>
  <text x="420" y="183" text-anchor="middle" font-size="11.5" font-weight="600" fill="#166534">Персонал</text>
  <text x="420" y="216" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14532d">192.168.30.0/24</text>
  <text x="420" y="240" text-anchor="middle" font-size="11" fill="#166534">Шлюз:</text>
  <text x="420" y="256" text-anchor="middle" font-size="11.5" font-weight="600" fill="#14532d">192.168.30.1</text>
  <line x1="362" y1="274" x2="478" y2="274" stroke="#86efac" stroke-width="1"/>
  <text x="420" y="298" text-anchor="middle" font-size="11" fill="#166534">Робочі місця</text>
  <text x="420" y="315" text-anchor="middle" font-size="11" fill="#166534">операторів (15 ПК)</text>
  <text x="420" y="340" text-anchor="middle" font-size="10.5" font-weight="700" fill="#15803d">Доступ до служб</text>

  <!-- VLAN 40 -->
  <rect x="512" y="148" width="144" height="212" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <rect x="512" y="148" width="144" height="42" rx="10" fill="#fde68a" stroke="#d97706" stroke-width="1.8"/>
  <text x="584" y="167" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">VLAN 40</text>
  <text x="584" y="183" text-anchor="middle" font-size="11.5" font-weight="600" fill="#92400e">Бухгалтерія</text>
  <text x="584" y="216" text-anchor="middle" font-size="11.5" font-weight="700" fill="#78350f">192.168.40.0/24</text>
  <text x="584" y="240" text-anchor="middle" font-size="11" fill="#92400e">Шлюз:</text>
  <text x="584" y="256" text-anchor="middle" font-size="11.5" font-weight="600" fill="#78350f">192.168.40.1</text>
  <line x1="526" y1="274" x2="642" y2="274" stroke="#fcd34d" stroke-width="1"/>
  <text x="584" y="298" text-anchor="middle" font-size="11" fill="#92400e">Фінансові ПК,</text>
  <text x="584" y="315" text-anchor="middle" font-size="11" fill="#92400e">принтер БФП-1</text>
  <text x="584" y="340" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b45309">Підвищена ізоляція</text>

  <!-- VLAN 50 -->
  <rect x="676" y="148" width="144" height="212" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <rect x="676" y="148" width="144" height="42" rx="10" fill="#fecaca" stroke="#dc2626" stroke-width="1.8"/>
  <text x="748" y="167" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">VLAN 50</text>
  <text x="748" y="183" text-anchor="middle" font-size="11.5" font-weight="600" fill="#991b1b">Гостьова</text>
  <text x="748" y="216" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7f1d1d">192.168.50.0/24</text>
  <text x="748" y="240" text-anchor="middle" font-size="11" fill="#991b1b">Шлюз:</text>
  <text x="748" y="256" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7f1d1d">192.168.50.1</text>
  <line x1="690" y1="274" x2="806" y2="274" stroke="#fca5a5" stroke-width="1"/>
  <text x="748" y="298" text-anchor="middle" font-size="11" fill="#991b1b">Wi-Fi мережа</text>
  <text x="748" y="315" text-anchor="middle" font-size="11" fill="#991b1b">для клієнтів</text>
  <text x="748" y="340" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b91c1c">Лише 80/443 інтернет</text>
</svg>
