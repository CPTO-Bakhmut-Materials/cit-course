<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="100%" height="auto" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="840" height="330" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Мапінг (зіставлення) полів під час імпорту з CSV до CRM</text>

  <!-- Left panel header -->
  <rect x="34" y="54" width="310" height="38" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="1.6"/>
  <text x="189" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Стовпець файлу clients_import.csv</text>

  <!-- Right panel header -->
  <rect x="496" y="54" width="310" height="38" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="1.6"/>
  <text x="651" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Поле бази даних Odoo / Dolibarr</text>

  <!-- Row 1: name -->
  <rect x="34" y="106" width="310" height="34" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="189" y="128" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">name (ТОВ «АгроТехСервіс»)</text>
  <line x1="344" y1="123" x2="490" y2="123" stroke="#334155" stroke-width="2" marker-end="url(#arrow-dark)"/>
  <rect x="496" y="106" width="310" height="34" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="651" y="128" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">Контакт / Назва компанії (Name)</text>

  <!-- Row 2: is_company -->
  <rect x="34" y="150" width="310" height="34" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="189" y="172" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14532d">is_company (True / False)</text>
  <line x1="344" y1="167" x2="490" y2="167" stroke="#334155" stroke-width="2" marker-end="url(#arrow-dark)"/>
  <rect x="496" y="150" width="310" height="34" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="651" y="172" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14532d">Ознака юридичної особи (Is a Company)</text>

  <!-- Row 3: vat -->
  <rect x="34" y="194" width="310" height="34" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="189" y="216" text-anchor="middle" font-size="12.5" font-weight="700" fill="#78350f">vat (38924512)</text>
  <line x1="344" y1="211" x2="490" y2="211" stroke="#334155" stroke-width="2" marker-end="url(#arrow-dark)"/>
  <rect x="496" y="194" width="310" height="34" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="651" y="216" text-anchor="middle" font-size="12.5" font-weight="700" fill="#78350f">Податковий номер / ЄДРПОУ (Tax ID)</text>

  <!-- Row 4: email -->
  <rect x="34" y="238" width="310" height="34" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="189" y="260" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">email (office@agrotech.ua)</text>
  <line x1="344" y1="255" x2="490" y2="255" stroke="#334155" stroke-width="2" marker-end="url(#arrow-dark)"/>
  <rect x="496" y="238" width="310" height="34" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="651" y="260" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">Електронна пошта (Email)</text>

  <!-- Row 5: phone / city / street -->
  <rect x="34" y="282" width="310" height="34" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="189" y="304" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7f1d1d">phone, city, street</text>
  <line x1="344" y1="299" x2="490" y2="299" stroke="#334155" stroke-width="2" marker-end="url(#arrow-dark)"/>
  <rect x="496" y="282" width="310" height="34" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="651" y="304" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7f1d1d">Телефон, місто, вулиця (Контакти)</text>

  <!-- Center badge -->
  <rect x="366" y="186" width="108" height="24" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
  <text x="420" y="202" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">Test / Validate</text>
</svg>
