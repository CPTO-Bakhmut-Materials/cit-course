<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" width="100%" height="auto" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="840" height="360" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Структура прав доступу Linux: POSIX, спеціальні біти та ACL</text>

  <!-- Top banner: example ls -ld output -->
  <rect x="110" y="52" width="620" height="64" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="1.8"/>
  <text x="420" y="77" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a" font-family="monospace">drwxrws---+   root   cpto_accounting   /srv/cpto_buh_docs</text>
  <text x="420" y="101" text-anchor="middle" font-size="12" fill="#334155">d (каталог) • rwx (власник = 7) • rws (група = 7 + SGID) • --- (інші = 0) • + (активний ACL)</text>

  <!-- Arrows down to 4 cards -->
  <line x1="210" y1="116" x2="118" y2="152" stroke="#334155" stroke-width="2" marker-end="url(#arrow-dark)"/>
  <line x1="350" y1="116" x2="319" y2="152" stroke="#334155" stroke-width="2" marker-end="url(#arrow-dark)"/>
  <line x1="490" y1="116" x2="521" y2="152" stroke="#334155" stroke-width="2" marker-end="url(#arrow-dark)"/>
  <line x1="630" y1="116" x2="722" y2="152" stroke="#334155" stroke-width="2" marker-end="url(#arrow-dark)"/>

  <!-- Card 1: POSIX -->
  <rect x="24" y="158" width="188" height="176" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <rect x="24" y="158" width="188" height="36" rx="10" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="118" y="181" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">Базові права (POSIX)</text>
  <text x="118" y="218" text-anchor="middle" font-size="12" font-weight="700" fill="#172554">u (User) • g (Group) • o</text>
  <text x="118" y="242" text-anchor="middle" font-size="11.5" fill="#1e40af">r (4) — читання / список</text>
  <text x="118" y="261" text-anchor="middle" font-size="11.5" fill="#1e40af">w (2) — запис / видалення</text>
  <text x="118" y="280" text-anchor="middle" font-size="11.5" fill="#1e40af">x (1) — запуск / вхід (cd)</text>
  <text x="118" y="315" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">chmod 770 (rwxrwx---)</text>

  <!-- Card 2: SGID -->
  <rect x="225" y="158" width="188" height="176" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <rect x="225" y="158" width="188" height="36" rx="10" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.8"/>
  <text x="319" y="181" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14532d">Спеціальний біт SGID</text>
  <text x="319" y="218" text-anchor="middle" font-size="12" font-weight="700" fill="#052e16">chmod g+s (біт 2)</text>
  <text x="319" y="242" text-anchor="middle" font-size="11.5" fill="#166534">Позначка «s» у групі</text>
  <text x="319" y="261" text-anchor="middle" font-size="11.5" fill="#166534">Усі нові файли всередині</text>
  <text x="319" y="280" text-anchor="middle" font-size="11.5" fill="#166534">успадковують групу папки</text>
  <text x="319" y="315" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">Спільні папки відділів</text>

  <!-- Card 3: Sticky bit -->
  <rect x="427" y="158" width="188" height="176" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <rect x="427" y="158" width="188" height="36" rx="10" fill="#fde68a" stroke="#d97706" stroke-width="1.8"/>
  <text x="521" y="181" text-anchor="middle" font-size="12.5" font-weight="700" fill="#78350f">Sticky bit (закріплення)</text>
  <text x="521" y="218" text-anchor="middle" font-size="12" font-weight="700" fill="#451a03">chmod +t (біт 1)</text>
  <text x="521" y="242" text-anchor="middle" font-size="11.5" fill="#92400e">Позначка «t» (1777)</text>
  <text x="521" y="261" text-anchor="middle" font-size="11.5" fill="#92400e">Видалити чужий файл</text>
  <text x="521" y="280" text-anchor="middle" font-size="11.5" fill="#92400e">не може інший користувач</text>
  <text x="521" y="315" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">Лише автор або root</text>

  <!-- Card 4: POSIX ACL -->
  <rect x="628" y="158" width="188" height="176" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <rect x="628" y="158" width="188" height="36" rx="10" fill="#fecaca" stroke="#dc2626" stroke-width="1.8"/>
  <text x="722" y="181" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7f1d1d">Списки POSIX ACL</text>
  <text x="722" y="218" text-anchor="middle" font-size="12" font-weight="700" fill="#450a0a">setfacl / getfacl</text>
  <text x="722" y="242" text-anchor="middle" font-size="11.5" fill="#991b1b">Позначка «+» у кінці прав</text>
  <text x="722" y="261" text-anchor="middle" font-size="11.5" fill="#991b1b">Персональні права для</text>
  <text x="722" y="280" text-anchor="middle" font-size="11.5" fill="#991b1b">окремих осіб (аудитора)</text>
  <text x="722" y="315" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">Тонкий контроль (-m / -d)</text>
</svg>
