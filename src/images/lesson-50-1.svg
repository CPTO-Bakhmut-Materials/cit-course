<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" width="100%" height="auto" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="840" height="360" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Життєвий цикл заявки Service Desk (SLA) та процес Post-mortem</text>

  <!-- Section 1 label -->
  <text x="24" y="64" font-size="13" font-weight="700" fill="#1e3a8a">1. Маршрут обробки заявки в Service Desk (GLPI / Zammad / Jira)</text>

  <!-- 5 Ticket stages -->
  <rect x="24" y="76" width="136" height="64" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="92" y="102" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">Нова</text>
  <text x="92" y="122" text-anchor="middle" font-size="11" fill="#1e40af">Реєстрація звернення</text>

  <line x1="160" y1="108" x2="184" y2="108" stroke="#334155" stroke-width="2" marker-end="url(#arrow-dark)"/>

  <rect x="188" y="76" width="136" height="64" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="256" y="102" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">Призначена</text>
  <text x="256" y="122" text-anchor="middle" font-size="11" fill="#1e40af">Вибір виконавця</text>

  <line x1="324" y1="108" x2="348" y2="108" stroke="#334155" stroke-width="2" marker-end="url(#arrow-dark)"/>

  <rect x="352" y="76" width="136" height="64" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="420" y="102" text-anchor="middle" font-size="12.5" font-weight="700" fill="#78350f">В роботі</text>
  <text x="420" y="122" text-anchor="middle" font-size="11" fill="#92400e">Діагностика й ремонт</text>

  <line x1="488" y1="108" x2="512" y2="108" stroke="#334155" stroke-width="2" marker-end="url(#arrow-dark)"/>

  <rect x="516" y="76" width="136" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="584" y="102" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14532d">Вирішена</text>
  <text x="584" y="122" text-anchor="middle" font-size="11" fill="#166534">Підтвердження юзера</text>

  <line x1="652" y1="108" x2="676" y2="108" stroke="#334155" stroke-width="2" marker-end="url(#arrow-dark)"/>

  <rect x="680" y="76" width="136" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="748" y="102" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14532d">Закрита</text>
  <text x="748" y="122" text-anchor="middle" font-size="11" fill="#166534">Запис у базу знань</text>

  <!-- SLA bar -->
  <rect x="24" y="150" width="792" height="28" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="420" y="169" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">Таймер SLA: контроль нормативного часу реакції (Response) та повного відновлення (MTTR)</text>

  <!-- Section 2 label -->
  <text x="24" y="208" font-size="13" font-weight="700" fill="#7f1d1d">2. Цикл розслідування аварії Blameless Post-mortem (без пошуку винних)</text>

  <!-- 4 Post-mortem cards -->
  <rect x="24" y="220" width="180" height="114" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <rect x="24" y="220" width="180" height="32" rx="10" fill="#fecaca" stroke="#dc2626" stroke-width="1.8"/>
  <text x="114" y="241" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">1. Фіксація інциденту</text>
  <text x="114" y="274" text-anchor="middle" font-size="11.5" fill="#991b1b">Час початку та кінця</text>
  <text x="114" y="292" text-anchor="middle" font-size="11.5" fill="#991b1b">Тривалість Downtime</text>
  <text x="114" y="310" text-anchor="middle" font-size="11.5" fill="#991b1b">Вплив на користувачів</text>

  <line x1="204" y1="277" x2="224" y2="277" stroke="#334155" stroke-width="2" marker-end="url(#arrow-dark)"/>

  <rect x="228" y="220" width="180" height="114" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <rect x="228" y="220" width="180" height="32" rx="10" fill="#fde68a" stroke="#d97706" stroke-width="1.8"/>
  <text x="318" y="241" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">2. Відновлення сервісу</text>
  <text x="318" y="274" text-anchor="middle" font-size="11.5" fill="#92400e">Діагностика логів</text>
  <text x="318" y="292" text-anchor="middle" font-size="11.5" fill="#92400e">Усунення збою та</text>
  <text x="318" y="310" text-anchor="middle" font-size="11.5" fill="#92400e">перевірка цілісності</text>

  <line x1="408" y1="277" x2="428" y2="277" stroke="#334155" stroke-width="2" marker-end="url(#arrow-dark)"/>

  <rect x="432" y="220" width="180" height="114" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <rect x="432" y="220" width="180" height="32" rx="10" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="522" y="241" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">3. Пошук першопричини</text>
  <text x="522" y="274" text-anchor="middle" font-size="11.5" fill="#1e40af">Root Cause Analysis</text>
  <text x="522" y="292" text-anchor="middle" font-size="11.5" fill="#1e40af">Аналіз прогалин процесу,</text>
  <text x="522" y="310" text-anchor="middle" font-size="11.5" fill="#1e40af">а не пошук «винного»</text>

  <line x1="612" y1="277" x2="632" y2="277" stroke="#334155" stroke-width="2" marker-end="url(#arrow-dark)"/>

  <rect x="636" y="220" width="180" height="114" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <rect x="636" y="220" width="180" height="32" rx="10" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.8"/>
  <text x="726" y="241" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">4. Профілактика</text>
  <text x="726" y="274" text-anchor="middle" font-size="11.5" fill="#166534">Чеклист Action Items</text>
  <text x="726" y="292" text-anchor="middle" font-size="11.5" fill="#166534">Тригери моніторингу</text>
  <text x="726" y="310" text-anchor="middle" font-size="11.5" fill="#166534">Оновлення SOP / Runbook</text>
</svg>
