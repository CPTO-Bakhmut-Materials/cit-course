<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="100%" height="auto" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="840" height="400" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="420" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Архітектура електронної пошти: шлях листа (MUA → MTA → MDA)</text>

  <!-- 1. Sender MUA -->
  <rect x="28" y="56" width="216" height="86" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <rect x="28" y="56" width="216" height="32" rx="10" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="136" y="77" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Відправник (MUA)</text>
  <text x="136" y="106" text-anchor="middle" font-size="12" fill="#172554">Поштовий клієнт</text>
  <text x="136" y="126" text-anchor="middle" font-size="11" fill="#1e40af">Thunderbird, Outlook, вебпошта</text>

  <!-- Arrow 1: Sender MUA -> Sender MTA -->
  <line x1="136" y1="142" x2="136" y2="190" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <text x="148" y="164" font-size="11.5" font-weight="700" fill="#1d4ed8">SMTP :587</text>
  <text x="148" y="180" font-size="10.5" fill="#334155">STARTTLS (Submission)</text>

  <!-- 2. Sender MTA -->
  <rect x="28" y="196" width="216" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <rect x="28" y="196" width="216" height="32" rx="10" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.8"/>
  <text x="136" y="217" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">MTA відправника</text>
  <text x="136" y="246" text-anchor="middle" font-size="12" font-weight="600" fill="#052e16">Сервер Postfix / Exim</text>
  <text x="136" y="266" text-anchor="middle" font-size="11" fill="#166534">Маршрутизація та пошук MX</text>

  <!-- Center DNS / Internet Info Box -->
  <rect x="304" y="96" width="232" height="114" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="420" y="120" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Інтернет та DNS-перевірка</text>
  <text x="420" y="144" text-anchor="middle" font-size="11.5" fill="#334155">MX — адреса поштового сервера</text>
  <text x="420" y="164" text-anchor="middle" font-size="11.5" fill="#334155">SPF — дозволені IP відправника</text>
  <text x="420" y="184" text-anchor="middle" font-size="11.5" fill="#334155">DKIM / DMARC — цифровий підпис</text>
  <text x="420" y="201" text-anchor="middle" font-size="10.5" fill="#64748b">PTR (зворотний DNS) для захисту від спаму</text>

  <!-- Arrow 2: Sender MTA -> Receiver MTA -->
  <path d="M 136 286 L 136 332 L 304 332" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow-green)"/>
  <text x="220" y="322" text-anchor="middle" font-size="11.5" font-weight="700" fill="#15803d">SMTP :25</text>
  <text x="220" y="350" text-anchor="middle" font-size="10.5" fill="#334155">Міжсерверна передача</text>

  <!-- 3. Receiver MTA -->
  <rect x="310" y="284" width="220" height="90" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <rect x="310" y="284" width="220" height="32" rx="10" fill="#fde68a" stroke="#d97706" stroke-width="1.8"/>
  <text x="420" y="305" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">MTA одержувача</text>
  <text x="420" y="334" text-anchor="middle" font-size="12" font-weight="600" fill="#451a03">Приймаючий Postfix</text>
  <text x="420" y="354" text-anchor="middle" font-size="11" fill="#92400e">Антиспам і прийом у домен</text>

  <!-- Arrow 3: Receiver MTA -> Receiver MDA -->
  <path d="M 530 332 L 704 332 L 704 292" fill="none" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrow-amber)"/>
  <text x="618" y="322" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b45309">Локальна доставка</text>
  <text x="618" y="350" text-anchor="middle" font-size="10.5" fill="#334155">LMTP → каталог Maildir/</text>

  <!-- 4. Receiver MDA -->
  <rect x="596" y="196" width="216" height="90" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <rect x="596" y="196" width="216" height="32" rx="10" fill="#fecaca" stroke="#dc2626" stroke-width="1.8"/>
  <text x="704" y="217" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">Агент доставки (MDA)</text>
  <text x="704" y="246" text-anchor="middle" font-size="12" font-weight="600" fill="#450a0a">Dovecot (скриньки Maildir)</text>
  <text x="704" y="266" text-anchor="middle" font-size="11" fill="#991b1b">Зберігання листів (new / cur / tmp)</text>

  <!-- Arrow 4: Receiver MDA -> Receiver MUA -->
  <line x1="704" y1="196" x2="704" y2="148" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow-dark)"/>
  <text x="692" y="166" text-anchor="end" font-size="11.5" font-weight="700" fill="#0f172a">IMAP :993</text>
  <text x="692" y="182" text-anchor="end" font-size="10.5" fill="#475569">або POP3 :995</text>

  <!-- 5. Receiver MUA -->
  <rect x="596" y="56" width="216" height="86" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <rect x="596" y="56" width="216" height="32" rx="10" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="704" y="77" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Одержувач (MUA)</text>
  <text x="704" y="106" text-anchor="middle" font-size="12" fill="#172554">Поштовий клієнт</text>
  <text x="704" y="126" text-anchor="middle" font-size="11" fill="#1e40af">Читання та синхронізація листів</text>
</svg>
