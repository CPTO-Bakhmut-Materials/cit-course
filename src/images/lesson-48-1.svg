<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" width="100%" height="auto" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="840" height="340" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="420" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Комплексна апаратна діагностика вузла інформаційної системи</text>

  <!-- Top Center: Hardware Passport -->
  <rect x="200" y="54" width="440" height="58" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="1.8"/>
  <text x="420" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">1. Паспорт апаратної конфігурації</text>
  <text x="420" y="99" text-anchor="middle" font-size="12" fill="#334155">lscpu (процесор) • lsblk (диски) • lshw / dmidecode (обладнання)</text>

  <!-- Arrows down to 4 cards -->
  <line x1="250" y1="112" x2="118" y2="146" stroke="#334155" stroke-width="2" marker-end="url(#arrow-dark)"/>
  <line x1="360" y1="112" x2="319" y2="146" stroke="#334155" stroke-width="2" marker-end="url(#arrow-dark)"/>
  <line x1="480" y1="112" x2="521" y2="146" stroke="#334155" stroke-width="2" marker-end="url(#arrow-dark)"/>
  <line x1="590" y1="112" x2="722" y2="146" stroke="#334155" stroke-width="2" marker-end="url(#arrow-dark)"/>

  <!-- Card 1: Storage -->
  <rect x="24" y="152" width="188" height="162" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <rect x="24" y="152" width="188" height="36" rx="10" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="118" y="175" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Накопичувачі (S.M.A.R.T.)</text>
  <text x="118" y="210" text-anchor="middle" font-size="12" font-weight="700" fill="#172554">smartctl -H / -A</text>
  <text x="118" y="232" text-anchor="middle" font-size="11" fill="#1e40af">ID 05: перепризначені</text>
  <text x="118" y="249" text-anchor="middle" font-size="11" fill="#1e40af">ID 197: нестабільні</text>
  <text x="118" y="266" text-anchor="middle" font-size="11" fill="#1e40af">SSD: % зносу (Wear)</text>
  <text x="118" y="296" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">Ріст RAW &gt; 0 → заміна</text>

  <!-- Card 2: RAM -->
  <rect x="225" y="152" width="188" height="162" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <rect x="225" y="152" width="188" height="36" rx="10" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.8"/>
  <text x="319" y="175" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14532d">Оперативна пам'ять</text>
  <text x="319" y="210" text-anchor="middle" font-size="12" font-weight="700" fill="#052e16">MemTest86+ / memtester</text>
  <text x="319" y="232" text-anchor="middle" font-size="11" fill="#166534">Запис і звірка</text>
  <text x="319" y="249" text-anchor="middle" font-size="11" fill="#166534">бітових масок у комірках</text>
  <text x="319" y="266" text-anchor="middle" font-size="11" fill="#166534">виявлення битих бітів</text>
  <text x="319" y="296" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">Будь-яка помилка → заміна</text>

  <!-- Card 3: CPU & Cooling -->
  <rect x="427" y="152" width="188" height="162" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <rect x="427" y="152" width="188" height="36" rx="10" fill="#fde68a" stroke="#d97706" stroke-width="1.8"/>
  <text x="521" y="175" text-anchor="middle" font-size="12.5" font-weight="700" fill="#78350f">CPU та охолодження</text>
  <text x="521" y="210" text-anchor="middle" font-size="12" font-weight="700" fill="#451a03">sensors + stress-ng</text>
  <text x="521" y="232" text-anchor="middle" font-size="11" fill="#92400e">Термодатчики ядер (30–50°C</text>
  <text x="521" y="249" text-anchor="middle" font-size="11" fill="#92400e">у спокої), оберти кулерів</text>
  <text x="521" y="266" text-anchor="middle" font-size="11" fill="#92400e">100% тест стабільності</text>
  <text x="521" y="296" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">&gt; 85°C → ризик тротлінгу</text>

  <!-- Card 4: IPMI / BMC -->
  <rect x="628" y="152" width="188" height="162" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <rect x="628" y="152" width="188" height="36" rx="10" fill="#fecaca" stroke="#dc2626" stroke-width="1.8"/>
  <text x="722" y="175" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7f1d1d">Серверне керування</text>
  <text x="722" y="210" text-anchor="middle" font-size="12" font-weight="700" fill="#450a0a">IPMI / BMC (iDRAC, iLO)</text>
  <text x="722" y="232" text-anchor="middle" font-size="11" fill="#991b1b">Незалежний контролер</text>
  <text x="722" y="249" text-anchor="middle" font-size="11" fill="#991b1b">на материнській платі</text>
  <text x="722" y="266" text-anchor="middle" font-size="11" fill="#991b1b">Журнал збоїв SEL</text>
  <text x="722" y="296" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">Працює навіть без ОС</text>
</svg>
