<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="auto" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="800" height="360" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Комплексне випробування та метрики продуктивності ІС</text>

  <!-- Complex Testing Chain -->
  <rect x="26" y="64" width="156" height="88" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="104" y="90" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">Клієнт / Тест (ab)</text>
  <text x="104" y="112" text-anchor="middle" font-size="12" fill="#172554">Генерація потоку</text>
  <text x="104" y="130" text-anchor="middle" font-size="11.5" fill="#1e40af">curl / ab -n 1000 -c 10</text>

  <line x1="182" y1="108" x2="218" y2="108" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="200" y="98" text-anchor="middle" font-size="10.5" font-weight="600" fill="#475569">HTTP</text>

  <rect x="224" y="64" width="156" height="88" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="302" y="90" text-anchor="middle" font-size="13.5" font-weight="700" fill="#92400e">Балансувальник</text>
  <text x="302" y="112" text-anchor="middle" font-size="12" fill="#451a03">Розподіл запитів</text>
  <text x="302" y="130" text-anchor="middle" font-size="11.5" fill="#92400e">Nginx / HAProxy / TLS</text>

  <line x1="380" y1="108" x2="416" y2="108" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="422" y="64" width="156" height="88" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="500" y="90" text-anchor="middle" font-size="13.5" font-weight="700" fill="#166534">Вебсервер</text>
  <text x="500" y="112" text-anchor="middle" font-size="12" fill="#052e16">Обробка бізнес-логіки</text>
  <text x="500" y="130" text-anchor="middle" font-size="11.5" fill="#166534">Статуси 200 OK / 5xx</text>

  <line x1="578" y1="108" x2="614" y2="108" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="620" y="64" width="154" height="88" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="697" y="90" text-anchor="middle" font-size="13.5" font-weight="700" fill="#991b1b">СКБД</text>
  <text x="697" y="112" text-anchor="middle" font-size="12" fill="#450a0a">Читання та транзакції</text>
  <text x="697" y="130" text-anchor="middle" font-size="11.5" fill="#991b1b">PostgreSQL / MySQL</text>

  <!-- Divider label -->
  <rect x="26" y="182" width="748" height="154" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="400" y="207" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Ключові метрики відповідності Технічним умовам (ТУ)</text>

  <!-- Metric 1: RPS -->
  <rect x="44" y="222" width="224" height="98" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="156" y="246" text-anchor="middle" font-size="13.5" font-weight="700" fill="#166534">RPS (Пропускна здатність)</text>
  <text x="156" y="268" text-anchor="middle" font-size="12" fill="#052e16">Кількість запитів за секунду</text>
  <text x="156" y="294" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">Критерій ТУ: ≥ 300 зап./с</text>

  <!-- Metric 2: Latency -->
  <rect x="288" y="222" width="224" height="98" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="400" y="246" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">Latency (Час відгуку)</text>
  <text x="400" y="268" text-anchor="middle" font-size="12" fill="#172554">Затримка обробки запиту (мс)</text>
  <text x="400" y="294" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">Критерій ТУ: ≤ 150 мс</text>

  <!-- Metric 3: Error Rate -->
  <rect x="532" y="222" width="224" height="98" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="644" y="246" text-anchor="middle" font-size="13.5" font-weight="700" fill="#991b1b">Error Rate (Помилки)</text>
  <text x="644" y="268" text-anchor="middle" font-size="12" fill="#450a0a">Частка збоїв (HTTP 500/502/503)</text>
  <text x="644" y="294" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">Критерій ТУ: 0% збоїв</text>
</svg>
