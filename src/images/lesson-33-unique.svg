<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="100%" height="auto" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="820" height="420" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="410" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Архітектура корпоративного файлового сервера: Samba та NFS</text>

  <!-- Left Column: Clients -->
  <text x="115" y="60" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Клієнти мережі</text>

  <!-- Samba Clients -->
  <rect x="26" y="74" width="178" height="132" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="115" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Робочі станції</text>
  <text x="115" y="120" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">Windows / macOS / Linux</text>
  <text x="115" y="144" text-anchor="middle" font-size="11.5" fill="#172554">Бухгалтерія, офіс,</text>
  <text x="115" y="161" text-anchor="middle" font-size="11.5" fill="#172554">аудитори, гості</text>
  <text x="115" y="188" text-anchor="middle" font-size="11" font-family="monospace" fill="#1e40af">smbclient / мережевий диск</text>

  <!-- NFS Clients -->
  <rect x="26" y="240" width="178" height="120" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="115" y="264" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Сервери та кластери</text>
  <text x="115" y="286" text-anchor="middle" font-size="12" font-weight="600" fill="#15803d">Linux / UNIX / Proxmox</text>
  <text x="115" y="310" text-anchor="middle" font-size="11.5" fill="#052e16">Гіпервізори, вебсервери,</text>
  <text x="115" y="327" text-anchor="middle" font-size="11.5" fill="#052e16">вузли резервного копіювання</text>
  <text x="115" y="348" text-anchor="middle" font-size="11" font-family="monospace" fill="#15803d">mount / /etc/fstab</text>

  <!-- Protocol Arrows -->
  <line x1="204" y1="140" x2="294" y2="140" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <text x="249" y="120" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e40af">SMB / CIFS</text>
  <text x="249" y="134" text-anchor="middle" font-size="10.5" fill="#334155">TCP 445, 139</text>
  <text x="249" y="156" text-anchor="middle" font-size="10.5" fill="#334155">UDP 137</text>

  <line x1="204" y1="300" x2="294" y2="300" stroke="#16a34a" stroke-width="2.4" marker-end="url(#arrow-green)"/>
  <text x="249" y="282" text-anchor="middle" font-size="11.5" font-weight="700" fill="#15803d">Протокол NFS</text>
  <text x="249" y="295" text-anchor="middle" font-size="10.5" fill="#334155">Рівень ядра</text>
  <text x="249" y="316" text-anchor="middle" font-size="10.5" fill="#334155">UID/GID + IP</text>

  <!-- Right Area: Linux File Server Container -->
  <rect x="300" y="54" width="494" height="332" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="547" y="76" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Файловий сервер Linux (каталог сховищ /srv/)</text>

  <!-- Samba Daemon Box -->
  <rect x="316" y="88" width="224" height="148" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="428" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Служба Samba</text>
  <text x="328" y="130" font-size="11.5" fill="#172554">• Демони: <tspan font-family="monospace" font-weight="700">smbd</tspan>, <tspan font-family="monospace" font-weight="700">nmbd</tspan></text>
  <text x="328" y="149" font-size="11.5" fill="#172554">• Конфіг: <tspan font-family="monospace">/etc/samba/smb.conf</tspan></text>
  <text x="328" y="168" font-size="11.5" fill="#172554">• Перевірка: <tspan font-family="monospace" font-weight="600">testparm -s</tspan></text>
  <text x="328" y="187" font-size="11.5" fill="#172554">• База паролів (NTLM):</text>
  <text x="336" y="204" font-size="11" font-family="monospace" font-weight="600" fill="#1e40af">sudo smbpasswd -a логін</text>
  <text x="328" y="224" font-size="10.5" font-style="italic" fill="#334155">Автентифікація за логіном/паролем</text>

  <!-- Arrows from Samba to Shares -->
  <line x1="540" y1="126" x2="574" y2="126" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-dark)"/>
  <line x1="540" y1="196" x2="574" y2="196" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-dark)"/>

  <!-- Share 1: [public] -->
  <rect x="580" y="88" width="198" height="68" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="679" y="108" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">[public] — гостьова</text>
  <text x="679" y="126" text-anchor="middle" font-size="11" font-family="monospace" fill="#78350f">/srv/samba/public</text>
  <text x="679" y="144" text-anchor="middle" font-size="11" fill="#451a03">guest ok = yes (права 0777)</text>

  <!-- Share 2: [accounting] -->
  <rect x="580" y="168" width="198" height="68" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="679" y="188" text-anchor="middle" font-size="12.5" font-weight="700" fill="#991b1b">[accounting] — захищена</text>
  <text x="679" y="206" text-anchor="middle" font-size="11" font-family="monospace" fill="#7f1d1d">/srv/samba/accounting</text>
  <text x="679" y="224" text-anchor="middle" font-size="11" fill="#7f1d1d">valid users = @accounting (2770)</text>

  <!-- NFS Server Box -->
  <rect x="316" y="252" width="224" height="118" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="428" y="274" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">Сервер NFS (Ядро)</text>
  <text x="328" y="294" font-size="11.5" fill="#052e16">• Пакет: <tspan font-family="monospace" font-weight="600">nfs-kernel-server</tspan></text>
  <text x="328" y="313" font-size="11.5" fill="#052e16">• Конфіг: <tspan font-family="monospace" font-weight="600">/etc/exports</tspan></text>
  <text x="328" y="332" font-size="11.5" fill="#052e16">• Оновлення: <tspan font-family="monospace" font-weight="600">exportfs -arv</tspan></text>
  <text x="328" y="353" font-size="11" fill="#14532d">• Опції: rw, sync, root_squash</text>

  <!-- Arrow from NFS to Export -->
  <line x1="540" y1="311" x2="574" y2="311" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-dark)"/>

  <!-- NFS Export Share -->
  <rect x="580" y="260" width="198" height="102" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="679" y="284" text-anchor="middle" font-size="12.5" font-weight="700" fill="#166534">Експорт резервних копій</text>
  <text x="679" y="304" text-anchor="middle" font-size="11" font-family="monospace" fill="#14532d">/srv/nfs/backups</text>
  <text x="679" y="326" text-anchor="middle" font-size="11" fill="#052e16">Прозорі UNIX-права,</text>
  <text x="679" y="344" text-anchor="middle" font-size="11" fill="#052e16">максимальна швидкодія</text>

  <!-- Footer Note -->
  <text x="410" y="406" text-anchor="middle" font-size="11.5" fill="#475569">Примітка: Samba перетворює права та паролі для Windows; NFS працює нативно в межах Linux/UNIX-мереж.</text>
</svg>
